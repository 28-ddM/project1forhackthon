<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>截止日雷达 · Deadline Radar v0.1</title>
<!--
  ① 样式区：任何人可以改，改完刷新就看到效果
  ② 结构区：改文案随时可以；新增元素要先跟写 JS 的人说
  ③ 逻辑区：独占。只有一个人改这里
-->
<style>
  :root{
    --bg:#f6f7f9;
    --card:#ffffff;
    --text:#181b1f;
    --muted:#6b7280;
    --line:#e6e8ec;
    --brand:#155eef;
    --brand-weak:#eaf0ff;
    --red:#c0341d;
    --red-weak:#fdf1ee;
    --amber:#9a5b00;
    --amber-weak:#fdf6e7;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.6; padding:22px 14px 72px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:820px; margin:0 auto;}

  /* 顶部 */
  .brand{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); letter-spacing:.4px;}
  .brand b{color:var(--brand); font-size:14px; letter-spacing:0;}
  .ver{font-size:11px; border:1px solid var(--line); border-radius:20px; padding:1px 8px; background:#fff;}
  h1{font-size:23px; line-height:1.35; margin:10px 0 8px; letter-spacing:.2px;}
  .lede{margin:0 0 18px; color:var(--muted); font-size:14px;}

  /* 卡片 */
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:14px;}
  .rowhead{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:8px;}
  label{font-size:13px; font-weight:600;}
  .link{
    background:none; border:none; color:var(--brand); font:inherit; font-size:12.5px;
    cursor:pointer; padding:2px 0; text-decoration:underline; text-underline-offset:3px;
  }
  textarea{
    width:100%; min-height:150px; resize:vertical; padding:12px;
    border:1px solid var(--line); border-radius:9px; background:#fcfcfd;
    font:inherit; font-size:14px; color:var(--text); line-height:1.7;
  }
  textarea:focus{outline:2px solid var(--brand-weak); border-color:var(--brand);}
  .actions{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap;}
  button{font:inherit; cursor:pointer; border-radius:9px; transition:.15s;}
  .primary{background:var(--brand); color:#fff; border:1px solid transparent; font-size:14px; font-weight:600; padding:10px 20px;}
  .primary:hover{filter:brightness(1.08);}
  .primary:disabled{opacity:.5; cursor:not-allowed;}
  .ghost{background:#fff; color:var(--muted); border:1px solid var(--line); font-size:14px; padding:10px 16px;}
  .ghost:hover{border-color:#c9ced6; color:var(--text);}
  .hint{font-size:12px; color:var(--muted); margin:10px 0 0;}

  /* 状态 */
  .state{padding:34px 10px; text-align:center; color:var(--muted); font-size:14px;}
  .state.err{color:var(--red); background:var(--red-weak); border:1px solid #f6dbd4; border-radius:10px; padding:14px; text-align:left;}
  .spin{display:inline-block; width:14px; height:14px; border:2px solid var(--line);
    border-top-color:var(--brand); border-radius:50%; animation:sp .7s linear infinite; vertical-align:-2px; margin-right:8px;}
  @keyframes sp{to{transform:rotate(360deg);}}

  /* 统计条 */
  .stats{display:flex; gap:18px; flex-wrap:wrap; font-size:13px; color:var(--muted); margin-bottom:14px;}
  .stats b{color:var(--text); font-size:15px;}
  .stats .hot b{color:var(--red);}

  /* 时间轴 */
  .tl{display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:2px;}
  .day{
    min-width:104px; flex:0 0 auto; background:#fff; border:1px solid var(--line);
    border-radius:11px; padding:9px 9px 10px;
  }
  .day.today{border-color:var(--brand); background:var(--brand-weak);}
  .day .wd{font-size:11px; color:var(--muted); letter-spacing:.5px;}
  .day .dt{font-size:17px; font-weight:700; margin:1px 0 6px;}
  .chip{
    display:block; font-size:11.5px; line-height:1.45; padding:5px 6px; border-radius:6px;
    background:var(--brand-weak); color:#123a8f; margin-bottom:5px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .chip.soon{background:var(--amber-weak); color:var(--amber);}
  .chip.urgent{background:var(--red-weak); color:var(--red); font-weight:600;}
  .chip.nodate{background:#f1f2f4; color:var(--muted);}
  .day .none{font-size:11.5px; color:#c2c7ce;}

  /* 事项卡 */
  .item{
    background:#fff; border:1px solid var(--line); border-left:3px solid var(--line);
    border-radius:10px; padding:12px 14px; margin-bottom:9px;
  }
  .item.soon{border-left-color:#e0a52a;}
  .item.urgent{border-left-color:var(--red);}
  .item .t{font-size:15px; font-weight:600; margin:0 0 5px; line-height:1.5;}
  .meta{display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--muted);}
  .meta .due{font-weight:600; color:var(--text);}
  .item.urgent .meta .due{color:var(--red);}
  .tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:7px;}
  .tag{font-size:11.5px; background:#eef1f5; color:#495260; border-radius:5px; padding:2px 7px;}
  .src{margin:8px 0 0; font-size:12px; color:#9aa1ab; border-left:2px solid var(--line); padding-left:8px;}

  footer{text-align:center; font-size:12px; color:var(--muted); margin-top:26px; line-height:1.8;}
</style>
</head>
<body>
<!-- ② 结构区 -->
<div class="wrap">

  <div class="brand"><b>截止日雷达</b><span>Deadline Radar</span><span class="ver">v0.1 · 规则引擎</span></div>
  <h1>一堆群通知，变成一条不会错过的截止日清单</h1>
  <p class="lede">粘贴群消息 → 自动抽出「做什么、什么时候交、要交什么材料」→ 一键导进手机日历。</p>

  <section class="card">
    <div class="rowhead">
      <label for="input">粘贴群消息（可以一次贴好几条）</label>
      <button class="link" id="sample">没有素材？填入示例</button>
    </div>
    <textarea id="input" placeholder="例：【学工办】请各班班长于下周五 18:00 前将汇总表发送至学工办邮箱，逾期不予受理。"></textarea>
    <div class="actions">
      <button class="primary" id="run">分析</button>
      <button class="ghost" id="clear">清空</button>
    </div>
    <p class="hint">完全离线运行，内容不会离开这台电脑。Ctrl + Enter 也可以触发。</p>
  </section>

  <section id="result">
    <div class="card"><div class="state">还没有结果。粘贴几条群通知，点「分析」。</div></div>
  </section>

  <footer>
    纯前端单文件，双击即可运行 · 不联网也能用<br>
    HENU HACK 2026 · 赛道 02 AI × EFFICIENCY 效率革命
  </footer>
</div>

<!-- ③ 逻辑区 -->
<script>
(function () {
  "use strict";

  var $input  = document.getElementById("input");
  var $run    = document.getElementById("run");
  var $clear  = document.getElementById("clear");
  var $sample = document.getElementById("sample");
  var $result = document.getElementById("result");

  var STORE = "deadline-radar:input";
  var MS_DAY = 86400000;

  /* ============ 工具 ============ */
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function startOfDay(d) { var x = new Date(d.getTime()); x.setHours(0, 0, 0, 0); return x; }
  function addDays(d, n) { return new Date(d.getTime() + n * MS_DAY); }
  function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function ymdCompact(d) { return "" + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()); }
  function dayDiff(a, b) { return Math.round((startOfDay(a) - startOfDay(b)) / MS_DAY); }

  var WD_CN = ["日", "一", "二", "三", "四", "五", "六"];

  /* ============ 日期解析（v0.1 的规则引擎，明天接 AI 只换这一段） ============ */
  function wdIndex(ch) {
    if (ch === "日" || ch === "天") return 0;
    if (ch >= "1" && ch <= "7") return (+ch) % 7;
    return "一二三四五六".indexOf(ch) + 1;
  }
  function offsetFromMonday(target) { return target === 0 ? 6 : target - 1; }
  function nextMondayDelta(cur) { var x = (8 - cur) % 7; return x === 0 ? 7 : x; }

  function parseWhen(text, base) {
    var due = null, m;

    // 1) 2026年11月13日 / 2026-11-13
    m = text.match(/(\d{4})\s*[年\-\/\.]\s*(\d{1,2})\s*[月\-\/\.]\s*(\d{1,2})\s*[日号]?/);
    if (m) due = new Date(+m[1], +m[2] - 1, +m[3]);

    // 2) 11月13日
    if (!due) {
      m = text.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]?/);
      if (m) {
        due = new Date(base.getFullYear(), +m[1] - 1, +m[2]);
        if (dayDiff(due, base) < -45) due.setFullYear(due.getFullYear() + 1);
      }
    }

    // 3) 11/13 或 11.13
    if (!due) {
      m = text.match(/(^|[^\d])(\d{1,2})\s*[\/\.]\s*(\d{1,2})([^\d]|$)/);
      if (m) {
        var mm = +m[2], dd = +m[3];
        if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) {
          due = new Date(base.getFullYear(), mm - 1, dd);
          if (dayDiff(due, base) < -45) due.setFullYear(due.getFullYear() + 1);
        }
      }
    }

    // 4) 相对日
    if (!due) {
      if (/大后天/.test(text)) due = addDays(base, 3);
      else if (/后天/.test(text)) due = addDays(base, 2);
      else if (/(明天|明日|明早|明晚)/.test(text)) due = addDays(base, 1);
      else if (/(今天|今日|今晚|今早)/.test(text)) due = addDays(base, 0);
    }

    // 5) 周X / 下周X / 下下周X / 本周X
    if (!due) {
      m = text.match(/(下下周|下周|这周|本周|周|星期|礼拜)([一二三四五六日天1-7])/);
      if (m) {
        var target = wdIndex(m[2]);
        var cur = base.getDay();
        var delta;
        if (m[1] === "下周") {
          delta = nextMondayDelta(cur) + offsetFromMonday(target);
        } else if (m[1] === "下下周") {
          delta = nextMondayDelta(cur) + offsetFromMonday(target) + 7;
        } else if (m[1] === "本周" || m[1] === "这周") {
          delta = offsetFromMonday(target) - offsetFromMonday(cur);
          if (delta < 0) delta += 7;
        } else {
          delta = (offsetFromMonday(target) - offsetFromMonday(cur) + 7) % 7;
        }
        due = addDays(base, delta);
      }
    }

    // 6) 月底 / 本月内
    if (!due && /(月底|本月内|月末)/.test(text)) {
      due = new Date(base.getFullYear(), base.getMonth() + 1, 0);
    }

    // 7) 只有「13号」这种
    if (!due) {
      m = text.match(/(^|[^\d])(\d{1,2})\s*[日号]/);
      if (m) {
        due = new Date(base.getFullYear(), base.getMonth(), +m[2]);
        if (dayDiff(due, base) < -10) due.setMonth(due.getMonth() + 1);
      }
    }

    // 时间
    var time = null;
    m = text.match(/(\d{1,2})\s*[:：]\s*(\d{2})/);
    if (m) {
      time = pad(+m[1]) + ":" + m[2];
    } else {
      m = text.match(/(上午|下午|晚上|中午|早上|凌晨)?\s*(\d{1,2})\s*[点時时](半|\d{1,2})?/);
      if (m) {
        var h = +m[2], mi = m[3] === "半" ? 30 : (m[3] ? +m[3] : 0), ap = m[1] || "";
        if ((ap === "下午" || ap === "晚上") && h < 12) h += 12;
        if (ap === "中午" && h < 12) h += 12;
        if (h >= 0 && h <= 23 && mi >= 0 && mi <= 59) time = pad(h) + ":" + pad(mi);
      }
    }

    if (!due) return { due: null, time: time };
    return { due: ymd(due), time: time };
  }

  /* ============ 材料识别 ============ */
  var MAT_RE = /(汇总表|报名表|申请表|登记表|表格|附件|截图|照片|扫描件|PDF|Word|PPT|Excel|文档|材料|证明|成绩单|简历|视频|链接|清单)/g;
  function extractMaterials(text) {
    var out = [], m, seen = {};
    MAT_RE.lastIndex = 0;
    while ((m = MAT_RE.exec(text)) !== null) {
      var k = m[1];
      if (!seen[k]) { seen[k] = 1; out.push(k); }
    }
    return out;
  }

  /* ============ 标题清洗 ============ */
  function cleanTitle(text) {
    var s = text.replace(/【[^】]{0,12}】/g, "").trim();
    var prev;
    do {
      prev = s;
      s = s.replace(/^[\s,，。;；:：、]+/, "")
           .replace(/^(各位同学|同学们|大家|注意|通知|提醒)[:：,，]?/, "")
           .replace(/^关于[^：:]{0,24}[：:]/, "");
    } while (s !== prev);
    if (s.length > 34) s = s.slice(0, 34) + "…";
    return s;
  }

  /* ============ 主流程：文字 → 事项 ============ */
  var ACTION_RE = /(请|务必|记得|截止|提交|交|报名|填写|上传|完成|参加|签到|缴纳|领取|报送|反馈)/;
  var DATE_HINT_RE = /(\d{1,2}\s*月|\d{4}\s*年|\d{1,2}\s*[日号]|今天|明天|后天|本周|这周|下周|周[一二三四五六日天1-7]|星期|礼拜|月底|月末)/;

  function extract(text) {
    var base = startOfDay(new Date());
    var lines = text.split(/[\n\r]+/);
    var items = [];
    var i, j;

    for (i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line) continue;
      var parts = line.split(/[。；;！!？?]/);
      for (j = 0; j < parts.length; j++) {
        var p = parts[j].trim();
        if (!p) continue;
        if (DATE_HINT_RE.test(p) || ACTION_RE.test(p)) {
          var when = parseWhen(p, base);
          var title = cleanTitle(p);
          if (!title) continue;
          items.push({
            title: title,
            due: when.due,
            time: when.time,
            materials: extractMaterials(p),
            source: p
          });
        } else if (items.length) {
          items[items.length - 1].source += "；" + p;
        }
      }
    }

    // 去重 + 计算紧急程度
    var seen = {}, out = [];
    for (i = 0; i < items.length; i++) {
      var key = items[i].title + "|" + items[i].due;
      if (seen[key]) continue;
      seen[key] = 1;
      var diff = items[i].due ? dayDiff(new Date(items[i].due.replace(/-/g, "/")), base) : null;
      items[i].days = diff;
      items[i].level = diff === null ? "nodate" : (diff <= 3 ? "urgent" : (diff <= 7 ? "soon" : ""));
      out.push(items[i]);
    }

    out.sort(function (a, b) {
      if (a.due === null && b.due === null) return 0;
      if (a.due === null) return 1;
      if (b.due === null) return -1;
      return a.due < b.due ? -1 : 1;
    });

    return out;
  }

  /* ============ 渲染 ============ */
  function el(tag, cls, text) {
    var d = document.createElement(tag);
    if (cls) d.className = cls;
    if (text !== undefined) d.textContent = text;
    return d;
  }

  function renderState(kind, msg) {
    $result.innerHTML = "";
    var card = el("section", "card");
    if (kind === "loading") {
      var s = el("div", "state");
      s.appendChild(el("span", "spin"));
      s.appendChild(document.createTextNode("正在读这些通知"));
      card.appendChild(s);
    } else if (kind === "error") {
      card.appendChild(el("div", "state err", msg));
    } else {
      card.appendChild(el("div", "state", msg));
    }
    $result.appendChild(card);
  }

  function render(items) {
    $result.innerHTML = "";

    var base = startOfDay(new Date());
    var urgent = items.filter(function (x) { return x.level === "urgent"; }).length;
    var noDate = items.filter(function (x) { return x.due === null; }).length;

    /* --- 统计 --- */
    var stats = el("div", "stats");
    var s1 = el("span"); s1.innerHTML = "共 <b>" + items.length + "</b> 条事项";
    var s2 = el("span", "hot"); s2.innerHTML = "3 天内 <b>" + urgent + "</b> 条";
    var s3 = el("span"); s3.innerHTML = "未注明日期 <b>" + noDate + "</b> 条";
    stats.appendChild(s1); stats.appendChild(s2); stats.appendChild(s3);

    /* --- 时间轴 --- */
    var tl = el("div", "tl");
    for (var d = 0; d <= 7; d++) {
      var day = addDays(base, d);
      var col = el("div", "day" + (d === 0 ? " today" : ""));
      col.appendChild(el("div", "wd", d === 0 ? "今天" : "周" + WD_CN[day.getDay()]));
      col.appendChild(el("div", "dt", (day.getMonth() + 1) + "/" + day.getDate()));

      var bucket = items.filter(function (x) { return x.due === ymd(day); });
      if (!bucket.length) {
        col.appendChild(el("div", "none", "—"));
      } else {
        bucket.forEach(function (x) {
          col.appendChild(el("span", "chip " + x.level, x.title));
        });
      }
      tl.appendChild(col);
    }
    var far = items.filter(function (x) { return x.days !== null && x.days > 7; });
    if (far.length) {
      var col2 = el("div", "day");
      col2.appendChild(el("div", "wd", "更远"));
      col2.appendChild(el("div", "dt", far.length + " 条"));
      far.slice(0, 3).forEach(function (x) {
        col2.appendChild(el("span", "chip", x.title));
      });
      tl.appendChild(col2);
    }
    if (noDate) {
      var col3 = el("div", "day");
      col3.appendChild(el("div", "wd", "未注明"));
      col3.appendChild(el("div", "dt", noDate + " 条"));
      col3.appendChild(el("span", "chip nodate", "需人工确认"));
      tl.appendChild(col3);
    }

    /* --- 列表 --- */
    var list = el("div");
    items.forEach(function (x) {
      var it = el("div", "item " + x.level);
      it.appendChild(el("p", "t", x.title));

      var meta = el("div", "meta");
      var dueTxt = x.due
        ? (x.due.slice(0, 4) + "/" + x.due.slice(5, 7) + "/" + x.due.slice(8, 10) + (x.time ? " " + x.time : ""))
        : "未注明截止时间";
      if (x.days === 0) dueTxt += " · 今天";
      else if (x.days > 0) dueTxt += " · 还剩 " + x.days + " 天";
      else if (x.days < 0) dueTxt += " · 已过 " + Math.abs(x.days) + " 天";
      meta.appendChild(el("span", "due", dueTxt));
      it.appendChild(meta);

      if (x.materials.length) {
        var tags = el("div", "tags");
        x.materials.forEach(function (mt) { tags.appendChild(el("span", "tag", "交：" + mt)); });
        it.appendChild(tags);
      }
      it.appendChild(el("p", "src", "原句：" + x.source.slice(0, 70)));

      list.appendChild(it);
    });

    /* --- 操作 --- */
    var ops = el("div", "actions");
    var copyBtn = el("button", "primary", "复制成清单");
    var icsBtn = el("button", "ghost", "下载日历文件 .ics");
    ops.appendChild(copyBtn);
    ops.appendChild(icsBtn);

    var cardStats = el("section", "card");
    cardStats.appendChild(stats);
    cardStats.appendChild(tl);

    var cardList = el("section", "card");
    cardList.appendChild(list);
    cardList.appendChild(ops);

    $result.appendChild(cardStats);
    $result.appendChild(cardList);

    copyBtn.addEventListener("click", function () { doCopy(items, copyBtn); });
    icsBtn.addEventListener("click", function () { doIcs(items); });
  }

  /* ============ 输出：复制 ============ */
  function doCopy(items, btn) {
    var lines = items.map(function (x) {
      return "· " + (x.due ? x.due + (x.time ? " " + x.time : "") : "未注明") + "  " + x.title +
        (x.materials.length ? "（交：" + x.materials.join("、") + "）" : "");
    });
    var text = "【截止日清单】\n" + lines.join("\n");

    function ok() {
      var t = btn.textContent;
      btn.textContent = "已复制 ✓";
      setTimeout(function () { btn.textContent = t; }, 1500);
    }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); ok(); } catch (e) { alert("复制失败，请手动选中结果区的文字"); }
      document.body.removeChild(ta);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, fallback);
    } else {
      fallback();
    }
  }

  /* ============ 输出：.ics 日历 ============ */
  function icsEscape(s) {
    return String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
  }
  function fold(line) {
    if (line.length <= 72) return line;
    var out = line.slice(0, 72);
    var rest = line.slice(72);
    while (rest.length) { out += "\r\n " + rest.slice(0, 71); rest = rest.slice(71); }
    return out;
  }

  function doIcs(items) {
    var withDate = items.filter(function (x) { return x.due; });
    if (!withDate.length) { alert("没有带日期的条目，先确认输入里有没有写截止时间"); return; }

    var now = new Date();
    var stamp = now.getUTCFullYear() + pad(now.getUTCMonth() + 1) + pad(now.getUTCDate()) + "T" +
                pad(now.getUTCHours()) + pad(now.getUTCMinutes()) + pad(now.getUTCSeconds()) + "Z";

    var L = [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-//Deadline Radar//HENU HACK 2026//CN",
      "CALSCALE:GREGORIAN",
      "METHOD:PUBLISH"
    ];

    withDate.forEach(function (x, idx) {
      var d0 = new Date(x.due.replace(/-/g, "/"));
      var d1 = addDays(d0, 1);
      L.push("BEGIN:VEVENT");
      L.push("UID:" + stamp + "-" + idx + "@deadline-radar");
      L.push("DTSTAMP:" + stamp);
      L.push("DTSTART;VALUE=DATE:" + ymdCompact(d0));
      L.push("DTEND;VALUE=DATE:" + ymdCompact(d1));
      L.push(fold("SUMMARY:" + icsEscape("截止 · " + x.title + (x.time ? " " + x.time : ""))));
      L.push(fold("DESCRIPTION:" + icsEscape(
        (x.materials.length ? "要交：" + x.materials.join("、") + "\n" : "") + "原句：" + x.source
      )));
      L.push("BEGIN:VALARM");
      L.push("TRIGGER:-PT12H");
      L.push("ACTION:DISPLAY");
      L.push(fold("DESCRIPTION:" + icsEscape("明天截止：" + x.title)));
      L.push("END:VALARM");
      L.push("END:VEVENT");
    });

    L.push("END:VCALENDAR");

    var blob = new Blob([L.join("\r\n")], { type: "text/calendar;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "截止日雷达.ics";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  /* ============ 交互 ============ */
  var busy = false;

  function run() {
    if (busy) return;
    var text = $input.value;
    if (!text.trim()) {
      renderState("error", "先粘几条群通知进来。也可以点右上角「填入示例」看效果。");
      $input.focus();
      return;
    }

    busy = true;
    $run.disabled = true;
    renderState("loading");

    setTimeout(function () {
      busy = false;
      $run.disabled = false;
      try {
        var items = extract(text);
        if (!items.length) {
          renderState("error", "没找到像「什么时候要做什么」的句子。试着带上「本周五 18:00 前」「11 月 13 日前」这类时间词再试。");
          return;
        }
        render(items);
      } catch (e) {
        renderState("error", "解析出错：" + e.message);
      }
    }, 260);
  }

  $run.addEventListener("click", run);

  $clear.addEventListener("click", function () {
    $input.value = "";
    try { localStorage.removeItem(STORE); } catch (e) {}
    renderState("idle", "还没有结果。粘贴几条群通知，点「分析」。");
    $input.focus();
  });

  $sample.addEventListener("click", function () {
    $input.value = [
      "【学工办】请各班班长于下周五 18:00 前将《创新学分汇总表》电子版发送至学工办邮箱，逾期不予受理。",
      "【教务】请于 2026 年 11 月 13 日前完成本学期评教，未完成的同学将影响成绩查询。",
      "各位同学注意：下周三上午 9 点在三号楼 302 开会，记得带上学生证和一份个人简历。",
      "关于奖学金申请的通知：符合条件的同学请在 11 月 20 日之前提交申请表和成绩单扫描件到辅导员处。",
      "明天中午 12 点前把宿舍卫生检查表交到生活委员那里。",
      "本学期读书笔记请于月底前提交至学习通。"
    ].join("\n");
    try { localStorage.setItem(STORE, $input.value); } catch (e) {}
    run();
  });

  document.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") run();
  });

  $input.addEventListener("input", function () {
    try { localStorage.setItem(STORE, $input.value); } catch (e) {}
  });

  try {
    var saved = localStorage.getItem(STORE);
    if (saved) $input.value = saved;
  } catch (e) {}
})();
</script>
