<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>截止日雷达 · 群消息变截止日清单</title>
<style>
/* ① 样式：lfl 独占改这一块，改完刷新就能看到 */
* { box-sizing: border-box; }
body {
  margin: 0; padding: 16px 14px 40px;
  font: 16px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  color: #1a1a1a; background: #f4f4f4;
}
.wrap { max-width: 720px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 4px; }
.sub { margin: 0 0 12px; color: #666; font-size: 14px; }
.stats {
  font-size: 14px; color: #333; background: #fff;
  border: 1px solid #e0e0e0; border-radius: 8px;
  padding: 10px 12px; margin-bottom: 12px;
}
.stats b { color: #c0392b; }
.card {
  background: #fff; border: 1px solid #e0e0e0;
  border-radius: 8px; padding: 12px; margin-bottom: 12px;
}
textarea {
  width: 100%; height: 128px; padding: 10px;
  font: inherit; font-size: 15px; line-height: 1.5;
  border: 1px solid #ccc; border-radius: 6px; resize: vertical;
}
textarea:focus { outline: 2px solid #999; outline-offset: -1px; }
.row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
button {
  font: inherit; font-size: 15px; padding: 9px 14px;
  border: 1px solid #ccc; background: #fff; border-radius: 6px;
  cursor: pointer; white-space: nowrap;
}
button:hover { border-color: #999; }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
.hint { font-size: 13px; color: #999; margin: 8px 0 0; }
/* 截图缩略图：粘一张就能看一张，粘错了能删 */
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.thumb {
  position: relative; width: 84px; height: 84px;
  border: 1px solid #ddd; border-radius: 6px; overflow: hidden; background: #fafafa;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb button {
  position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; padding: 0;
  border: none; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff;
  font-size: 13px; line-height: 1; cursor: pointer;
}
.card.dragging { border-color: #1a1a1a; background: #fbfbfb; }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.tabs button { font-size: 14px; padding: 7px 12px; }
.tabs button.on { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
.group-title {
  font-size: 13px; color: #888; margin: 16px 0 6px;
  display: flex; align-items: center; gap: 8px;
}
.group-title::after { content: ""; flex: 1; height: 1px; background: #e6e6e6; }
.item {
  display: flex; gap: 10px; align-items: flex-start;
  background: #fff; border: 1px solid #e0e0e0; border-left: 4px solid #ddd;
  border-radius: 6px; padding: 10px; margin-bottom: 8px;
}
.item.g-urgent { border-left-color: #c0392b; }
.item.g-week   { border-left-color: #e0a800; }
.item.g-over   { border-left-color: #999; }
.item.is-done { background: #fafafa; }
.item.is-done .t { text-decoration: line-through; color: #999; }
.chk {
  flex: 0 0 auto; width: 28px; height: 28px; padding: 0;
  font-size: 16px; line-height: 1; border-radius: 6px;
}
.body { flex: 1; min-width: 0; }
.t { font-size: 16px; font-weight: 600; word-break: break-word; }
.meta { font-size: 13px; color: #666; margin-top: 3px; }
.meta .red { color: #c0392b; font-weight: 600; }
.tags { margin-top: 6px; }
.tag {
  display: inline-block; font-size: 12px; color: #555;
  background: #f0f0f0; border-radius: 4px;
  padding: 2px 7px; margin: 0 4px 4px 0;
}
details.src { margin-top: 6px; }
details.src summary {
  font-size: 12px; color: #999; cursor: pointer;
  list-style: none; padding: 2px 0;
}
details.src summary::-webkit-details-marker { display: none; }
details.src summary::before { content: "▸ "; }
details.src[open] summary::before { content: "▾ "; }
details.src p { font-size: 12px; color: #777; margin: 4px 0 0; padding: 6px 8px; background: #f7f7f7; border-radius: 4px; }
.del {
  flex: 0 0 auto; border: none; background: none; color: #ccc;

}
.del:hover { color: #c0392b; }
.empty {
  color: #888; font-size: 14px; padding: 20px 16px; text-align: center;
  background: #fff; border: 1px dashed #ddd; border-radius: 8px;
}
.ops { display: flex; gap: 8px; flex-wrap: wrap; }
.ops .danger { color: #c0392b; border-color: #e6b3ae; }
details.ai summary {
  cursor: pointer; font-size: 14px; color: #555; list-style: none;
}
details.ai summary::-webkit-details-marker { display: none; }
details.ai summary::before { content: "▸ "; }
details.ai[open] summary::before { content: "▾ "; }
.ai-sum { font-size: 12px; color: #999; }
.ai-sum.on { color: #1a7f37; }
.ai-row { margin-top: 10px; }
.ai-row label { display: block; font-size: 13px; color: #666; }
.ai-row select, .ai-row input[type=password], .ai-row input[type=text] {
  width: 100%; margin-top: 4px; padding: 8px 10px; font: inherit; font-size: 14px;
  border: 1px solid #ccc; border-radius: 6px; background: #fff;
}
.ai-ck { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #666; }
.ai-tip {
  font-size: 12px; line-height: 1.65; color: #888;
  margin: 10px 0 0; padding: 8px 10px;
  background: #f7f7f7; border-radius: 6px;
}
.ai-tip a { color: #1a5fb4; }
.ai-tip code { font-size: 11px; background: #efefef; padding: 1px 4px; border-radius: 3px; }
.ai-state { font-size: 13px; margin: 10px 0 0; color: #666; }
.ai-state.on { color: #1a7f37; }
.ai-state.err { color: #c0392b; }
.ai-badge {
  font-size: 11px; font-weight: 400; color: #1a7f37;
  border: 1px solid #b7e0c3; background: #f2fbf5;
  border-radius: 4px; padding: 0 4px; margin-left: 6px; vertical-align: 2px;
}
@media (max-width: 480px) {
  body { padding: 12px 10px 32px; }
  h1 { font-size: 20px; }
  button { font-size: 14px; padding: 9px 12px; }
  .row button { flex: 1 1 auto; }
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>截止日雷达</h1>
    <p class="sub">粘贴群消息，自动变成一条不会错过的截止日清单。</p>
    <div class="stats" id="stats">清单还是空的。先粘几条群通知试试。</div>
  </header>

  <!-- ② 结构：新增/删除带 id 的元素前先跟写 JS 的人说一声 -->
  <section class="card" id="inputCard">
    <textarea id="input" placeholder="把群消息整段粘进来，或者直接 Ctrl + V 粘贴聊天截图、把图片拖进来。&#10;比如：【学工办】请各班班长于下周五 18:00 前将《创新学分汇总表》发到学工办邮箱。"></textarea>
    <div class="thumbs" id="thumbs" hidden></div>
    <div class="row">
      <button id="run" class="primary">分析并加入清单</button>
      <button id="pick">粘贴 / 选择截图</button>
      <button id="sample">填入示例</button>
      <button id="clear">清空输入</button>
    </div>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <p class="hint">Ctrl + Enter 也能分析。截图可直接 Ctrl + V 或拖进来（最多 6 张，需填 Key）。数据只存在你自己的浏览器里，不上传。</p>
  </section>

  <!-- AI 概括层：DeepSeek。不填 Key 就是纯本地规则，断网也能用 -->
  <details class="card ai" id="aibox">
    <summary>AI 概括（DeepSeek）<span class="ai-sum" id="aiSum">· 未接入</span></summary>
    <p class="ai-tip">
      去 <a href="https://platform.deepseek.com/api_keys" target="_blank" rel="noopener">platform.deepseek.com</a>
      创建 Key（<code>sk-</code> 开头，需账户有余额，一次分析约几分钱）。<br>
      Key 只存在你自己的浏览器里，不写进代码、不上传。
    </p>
    <div class="ai-row">
      <label>API Key
        <input id="aiKey" type="password" autocomplete="off" placeholder="粘贴 sk- 开头的 Key">
      </label>
    </div>
    <div class="row">
      <button id="aiTest">测试连接</button>
      <label class="ai-ck"><input type="checkbox" id="aiRemember"> 在这台设备记住</label>
    </div>
    <p class="ai-state" id="aiStatus">当前：本地规则模式。断网可用，但只会「摘句」，不会「概括」。</p>
  </details>

  <nav class="tabs" id="tabs">
    <button data-tab="todo" class="on">待办</button>
    <button data-tab="done">已完成</button>
    <button data-tab="all">全部</button>
  </nav>

  <section id="result"></section>

  <section class="card ops" id="ops" style="display:none">
    <button id="ics">下载日历文件 .ics</button>
    <button id="copy">复制成清单</button>
    <button id="wipe" class="danger">清空全部清单</button>
  </section>

</div>

<script>
/* ③ 逻辑：技术操盘手独占改这一块 */
(function () {
  "use strict";

  var $input  = document.getElementById("input");
  var $run    = document.getElementById("run");
  var $clear  = document.getElementById("clear");
  var $sample = document.getElementById("sample");
  var $pick   = document.getElementById("pick");
  var $file   = document.getElementById("file");
  var $thumbs = document.getElementById("thumbs");
  var $inCard = document.getElementById("inputCard");
  var $result = document.getElementById("result");
  var $stats  = document.getElementById("stats");
  var $tabs   = document.getElementById("tabs");
  var $ops    = document.getElementById("ops");
  var $ics    = document.getElementById("ics");
  var $copy   = document.getElementById("copy");
  var $wipe   = document.getElementById("wipe");
  var $aiBox  = document.getElementById("aibox");
  var $aiKey  = document.getElementById("aiKey");
  var $aiTest = document.getElementById("aiTest");
  var $aiRem  = document.getElementById("aiRemember");
  var $aiStat = document.getElementById("aiStatus");
  var $aiSum  = document.getElementById("aiSum");

  var STORE_INPUT = "deadline-radar:input";     // 输入框草稿
  var STORE_ITEMS = "deadline-radar:items";     // 累积清单（PRD 8. 数据契约）
  var MS_DAY = 86400000;

  var tab = "todo";        // todo | done | all
  var busy = false;

  /* ============ 工具 ============ */
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function startOfDay(d) { var x = new Date(d.getTime()); x.setHours(0, 0, 0, 0); return x; }
  function addDays(d, n) { return new Date(d.getTime() + n * MS_DAY); }
  function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function ymdCompact(d) { return "" + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()); }
  function dayDiff(a, b) { return Math.round((startOfDay(a) - startOfDay(b)) / MS_DAY); }
  function parseYmd(s) { return s ? new Date(s.replace(/-/g, "/")) : null; }

  var WD_CN = ["日", "一", "二", "三", "四", "五", "六"];

  /* ============ 日期解析 ============ */
  function wdIndex(ch) {
    if (ch === "日" || ch === "天") return 0;
    if (ch >= "1" && ch <= "7") return (+ch) % 7;
    return "一二三四五六".indexOf(ch) + 1;
  }
  function offsetFromMonday(target) { return target === 0 ? 6 : target - 1; }
  function nextMondayDelta(cur) { var x = (8 - cur) % 7; return x === 0 ? 7 : x; }

  /* ============ 区间日期：取「截止」那一端 ============ */
  // 「11月2日8:00—11月7日24:00」的截止日是 11/7，不是 11/2。
  // 「11月2日8:00—11月7日24:00」的截止日是 11/7，不是 11/2。
  var RANGE_RE = /((?:\d{4}\s*年\s*)?\d{1,2}\s*月\s*\d{1,2}\s*[日号]?)(?:\s*\d{1,2}\s*[:：]\s*\d{2})?\s*(?:—|－|–|-|~|～|至|到)\s*((?:\d{4}\s*年\s*)?\d{1,2}\s*月\s*\d{1,2}\s*[日号]?)(\s*\d{1,2}\s*[:：]\s*\d{2})?/;
  function normalizeRange(text) {
    var m = text.match(RANGE_RE);
    if (!m) return text;
    var end = m[2];
    if (!/\d{4}/.test(end) && /\d{4}/.test(m[1])) {
      end = m[1].match(/\d{4}/)[0] + "年" + end;
    }
    return text.replace(RANGE_RE, end + (m[3] || ""));
  }

  function parseWhen(text, base) {
    text = normalizeRange(text);
    var due = null, m;

    // 1) 2026年11月13日 / 2026-11-13
    m = text.match(/(\d{4})\s*[年\-\/\.]\s*(\d{1,2})\s*[月\-\/\.]\s*(\d{1,2})\s*[日号]?/);
    if (m) due = new Date(+m[1], +m[2] - 1, +m[3]);

    // 2) 11月13日
    if (!due) {
      m = text.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]?/);
      if (m) {
        due = new Date(base.getFullYear(), +m[1] - 1, +m[2]);
        if (dayDiff(due, base) < -45) due.setFullYear(due.getFullYear() + 1);
      }
    }

    // 3) 11/13 或 11.13
    if (!due) {
      m = text.match(/(^|[^\d])(\d{1,2})\s*[\/\.]\s*(\d{1,2})([^\d]|$)/);
      if (m) {
        var mm = +m[2], dd = +m[3];
        if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) {
          due = new Date(base.getFullYear(), mm - 1, dd);
          if (dayDiff(due, base) < -45) due.setFullYear(due.getFullYear() + 1);
        }
      }
    }

    // 4) 相对日
    if (!due) {
      if (/大后天/.test(text)) due = addDays(base, 3);
      else if (/后天/.test(text)) due = addDays(base, 2);
      else if (/(明天|明日|明早|明晚)/.test(text)) due = addDays(base, 1);
      else if (/(今天|今日|今晚|今早)/.test(text)) due = addDays(base, 0);
    }

    // 5) 周X / 下周X / 下下周X / 本周X
    if (!due) {
      m = text.match(/(下下周|下周|这周|本周|周|星期|礼拜)([一二三四五六日天1-7])/);
      if (m) {
        var target = wdIndex(m[2]);
        var cur = base.getDay();
        var delta;
        if (m[1] === "下周") {
          delta = nextMondayDelta(cur) + offsetFromMonday(target);
        } else if (m[1] === "下下周") {
          delta = nextMondayDelta(cur) + offsetFromMonday(target) + 7;
        } else if (m[1] === "本周" || m[1] === "这周") {
          delta = offsetFromMonday(target) - offsetFromMonday(cur);
          if (delta < 0) delta += 7;
        } else {
          delta = (offsetFromMonday(target) - offsetFromMonday(cur) + 7) % 7;
        }
        due = addDays(base, delta);
      }
    }

    // 6) 月底 / 本月内
    if (!due && /(月底|本月内|月末)/.test(text)) {
      due = new Date(base.getFullYear(), base.getMonth() + 1, 0);
    }

    // 7) 只有「13号」这种
    if (!due) {
      m = text.match(/(^|[^\d])(\d{1,2})\s*[日号]/);
      if (m) {
        due = new Date(base.getFullYear(), base.getMonth(), +m[2]);
        if (dayDiff(due, base) < -10) due.setMonth(due.getMonth() + 1);
      }
    }

    // 时间
    var time = null;
    m = text.match(/(\d{1,2})\s*[:：]\s*(\d{2})/);
    if (m) {
      time = pad(+m[1]) + ":" + m[2];
    } else {
      m = text.match(/(上午|下午|晚上|中午|早上|凌晨)?\s*(\d{1,2})\s*[点時时](半|\d{1,2})?/);
      if (m) {
        var h = +m[2], mi = m[3] === "半" ? 30 : (m[3] ? +m[3] : 0), ap = m[1] || "";
        if ((ap === "下午" || ap === "晚上") && h < 12) h += 12;
        if (ap === "中午" && h < 12) h += 12;
        if (h >= 0 && h <= 24 && mi >= 0 && mi <= 59) time = pad(h) + ":" + pad(mi);
      }
    }

    if (!due) return { due: null, time: time };
    return { due: ymd(due), time: time };
  }

  /* ============ 材料识别 ============ */
  // 注意：不收录「链接」「网址」——它们几乎都出现在「通知链接」这类噪声里
  var MAT_RE = /(汇总表|报名表|申请表|登记表|表格|附件|截图|照片|扫描件|PDF|Word|PPT|Excel|文档|材料|证明|成绩单|简历|视频|清单|作品|策划案|报名费)/g;
  function extractMaterials(text) {
    var out = [], m, seen = {};
    MAT_RE.lastIndex = 0;
    while ((m = MAT_RE.exec(text)) !== null) {
      var k = m[1];
      if (!seen[k]) { seen[k] = 1; out.push(k); }
    }
    return out;
  }

  /* ============ 标题清洗 ============ */
  function cleanTitle(text) {
    var s = text
      .replace(/【[^】]{0,12}】/g, "")            // 【学工办】这类抬头
      .replace(/@[^\s，。；：、]{1,12}/g, " ")    // @所有人 @某某
      .replace(/^[^\u4e00-\u9fa5A-Za-z0-9（(《【]+/, "") // 开头的 emoji / ⏰✅🔹 等符号
      .trim();
    var prev;
    do {
      prev = s;
      s = s.replace(/^[\s,，。;；:：、]+/, "")
           .replace(/^(各位同学|同学们|大家|注意|通知|提醒|请|务必|现|另)[:：,，]?/, "")
           .replace(/^关于[^：:]{0,24}[：:]/, "");
    } while (s !== prev);
    // 砍掉「，主题…」「，详情…」这类补充说明，它们不是事项本身
    s = s.replace(/[，,；;](主题|详情|具体|详见|可个人|可组队|可团队|请大家|有兴趣|有意愿)[\s\S]*$/, "");
    if (s.length > 34) s = s.slice(0, 34) + "…";
    return s;
  }

  /* ============ 抽取：文字 → items[]（纯函数，不碰 DOM） ============ */
  // 出现其一，说明这句在要求「做某件事」
  var ACTION_RE = /(截止|提交|交|报名|填写|填好|上传|发送|发至|完成|参加|签到|缴纳|缴|领取|报送|反馈|进群|扫码|加入|开会|会议|路演|考试|答题|面试|办理|确认|下载|打印|转发|保存|签字|盖章)/;
  // 时间线索
  var DATE_HINT_RE = /(\d{1,2}\s*月|\d{4}\s*年|\d{1,2}\s*[日号]|今天|明天|后天|大后天|本周|这周|下周|下下周|周[一二三四五六日天1-7]|星期|礼拜|月底|月末|这两天|尽快)/;
  // 这句话本身就在说「什么时候截止」，即使没有动作词也要留下
  var TIME_SAY_RE = /(时间为|截止|有效期|之前|前完成|前提交|前交)/;

  // 消息头：2026年10月30日 21:06 / 2026-11-02 8:18
  var HEAD_RE = /^(\d{4})\s*[年\-\/\.]\s*(\d{1,2})\s*[月\-\/\.]\s*(\d{1,2})\s*[日号]?\s+(\d{1,2})\s*[:：]\s*(\d{2})$/;

  function isHead(line) { return HEAD_RE.test(line.trim()); }
  // 夹在两条消息头之间的纯昵称行（如「魚🐟渝🔒」）
  function isNick(line) {
    var l = line.trim();
    return l.length > 0 && l.length <= 20 && !/[。，；：！？、,;:!?]/.test(l) && !isHead(l);
  }

  // 按「消息」切块：每块带上发送日期，作为「今天/明天/下周三」的基准。
  // 这一步是准确率的命门——11 月 4 日发的「今晚 6 点前」，指的是 11/4，不是今天。
  function splitMessages(text) {
    var lines = text.split(/\r?\n/);
    var heads = [], i;
    for (i = 0; i < lines.length; i++) if (isHead(lines[i])) heads.push(i);
    if (!heads.length) return [{ sentAt: null, body: lines }];

    var msgs = [];
    for (i = 0; i < heads.length; i++) {
      var s = heads[i];
      var e = (i + 1 < heads.length) ? heads[i + 1] : lines.length;
      var m = lines[s].trim().match(HEAD_RE);
      var body = lines.slice(s + 1, e);
      // 末尾那行是下一条消息的发送人昵称，不属于本条
      if (body.length && isNick(body[body.length - 1])) body.pop();
      msgs.push({ sentAt: new Date(+m[1], +m[2] - 1, +m[3]), body: body });
    }
    return msgs;
  }

  function extract(text) {
    var today = startOfDay(new Date());
    var msgs = splitMessages(text);
    var items = [];

    msgs.forEach(function (msg) {
      var base = msg.sentAt || today;
      var raw = msg.body.join("\n");
      if (!raw.trim()) return;

      // ① 去掉链接：URL 里的 t20260313 会被误认成日期
      var clean = raw.replace(/https?:\/\/[^\s，。；）】"']+/g, " ");

      // ② 切成句子，附件行整行丢掉
      var segs = [];
      clean.split(/\n/).forEach(function (line) {
        var t = line.trim();
        if (!t) return;
        if (/^\[(图片|文件|视频|语音|动画表情|表情)\]/.test(t)) return;
        t.split(/[。；;！!？?]/).forEach(function (p) {
          p = p.trim();
          if (p) segs.push(p);
        });
      });

      // ③ 这条消息里最适合当标题的那句（用于「时间为：…」这种纯时间句）
      var msgTitle = "";
      (function () {
        for (var k = 0; k < segs.length; k++) {
          var c = cleanTitle(segs[k]);
          if (c && c.replace(/[\d\s年月日号:：—\-（）()]/g, "").length >= 8) { msgTitle = c; return; }
        }
      })();

      // ④ 逐句判断，同时满足「说了时间」和「要求做事/在说截止」才收
      segs.forEach(function (p) {
        if (p.length < 5) return;
        var isBareDate = /^\D{0,6}\d{4}\s*年\s*\d{1,2}\s*月\s*\d{1,2}\s*日/.test(p) && p.length < 26;
        if (isBareDate) return;

        var when = parseWhen(p, base);
        var hasTime = !!(when.due || when.time || DATE_HINT_RE.test(p));
        if (!hasTime) return;
        if (!ACTION_RE.test(p) && !TIME_SAY_RE.test(p)) return;

        // 没有日期又极短（「大家尽快完成」），脱离上下文没有意义，丢掉
        if (!when.due && p.length < 10) return;

        var title = cleanTitle(p);
        if (!title) return;
        // 「活动时间为：…」这类纯时间句，换成消息开头那句
        if (/^(活动)?时间为/.test(title) && msgTitle) title = msgTitle;
        // 「详情见通知链接，有意参赛同学请于 11 月 7 日前…」也是补充说明，
        // 真正的主题在消息开头，换成 msgTitle
        if (msgTitle && /^(详情见|详见|有意|请于|请|如需|如有|想要|需要报名|本条|本通知|报名)/.test(title)) {
          title = msgTitle;
        }
        // 去掉标题开头的日期（下面已经单独显示了日期）
        var stripped = title
          .replace(/^\d{4}\s*年\s*\d{1,2}\s*月\s*\d{1,2}\s*[日号]?\s*(\d{1,2}\s*[:：]\s*\d{2})?\s*/, "")
          .replace(/^\d{1,2}\s*月\s*\d{1,2}\s*[日号]?\s*(\d{1,2}\s*[:：]\s*\d{2})?\s*/, "");
        if (stripped.length >= 3) title = stripped;
        title = title.replace(/[，,：:]?(事项如下|通知如下|如下)[：:]?$/, "");
        if (!title) return;
        items.push({
          title: title,
          due: when.due,
          time: when.time,
          materials: extractMaterials(p),
          source: p
        });
      });
    });

    // ④ 批内去重
    var seen = {}, out = [];
    items.forEach(function (x) {
      var key = x.title + "|" + x.due;
      if (seen[key]) return;
      seen[key] = 1;
      out.push(x);
    });
    return out;
  }

  /* ============ 存储：累积清单（PRD 5. 追加不覆盖） ============
     重要：内存里的 STATE 才是唯一数据源，localStorage 只负责「下次打开还在」。
     否则一旦浏览器禁用了存储（预览面板的沙箱 iframe、无痕模式、禁 Cookie），
     写不进去又每次重读 -> 页面永远空白且不报错。 */
  var STATE = null;
  var STORAGE_OK = true;

  function load() {
    try {
      var raw = localStorage.getItem(STORE_ITEMS);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) { STORAGE_OK = false; return []; }
  }
  function current() {
    if (STATE === null) STATE = load();
    return STATE;
  }
  function save(list) {
    STATE = list;
    try { localStorage.setItem(STORE_ITEMS, JSON.stringify(list)); }
    catch (e) { STORAGE_OK = false; }
  }
  function itemKey(x) { return x.title + "|" + (x.due || "") + "|" + (x.time || ""); }

  function mergeItems(fresh) {
    var all = current();
    var seen = {};
    all.forEach(function (x) { seen[itemKey(x)] = 1; });
    var added = 0;
    fresh.forEach(function (x) {
      var k = itemKey(x);
      if (seen[k]) return;
      seen[k] = 1;
      x.id = String(Date.now()) + "-" + Math.random().toString(36).slice(2, 7);
      x.done = false;
      all.push(x);
      added++;
    });
    save(all);
    return added;
  }

  /* 每次渲染重算天数与紧急程度（昨天存的 due 今天可能已经过期） */
  function refreshMeta(list) {
    var base = startOfDay(new Date());
    list.forEach(function (x) {
      if (x.due) {
        x.days = dayDiff(parseYmd(x.due), base);
        x.level = x.days < 0 ? "over" : (x.days <= 3 ? "urgent" : (x.days <= 7 ? "soon" : ""));
      } else {
        x.days = null;
        x.level = "nodate";
      }
    });
    return list;
  }

  /* ============ 渲染 ============ */
  function el(tag, cls, text) {
    var d = document.createElement(tag);
    if (cls) d.className = cls;
    if (text !== undefined) d.textContent = text;
    return d;
  }

  function dueText(x) {
    if (!x.due) return "未写日期";
    var d = parseYmd(x.due);
    var s = (d.getMonth() + 1) + "月" + d.getDate() + "日 周" + WD_CN[d.getDay()];
    if (x.time) s += " " + x.time;
    return s;
  }
  function relText(x) {
    if (x.days === null) return "";
    if (x.days < 0) return "已过 " + (-x.days) + " 天";
    if (x.days === 0) return "就是今天";
    return "还有 " + x.days + " 天";
  }

  var GROUPS = [
    { k: "over",   t: "已过期" },
    { k: "urgent", t: "3 天内" },
    { k: "soon",   t: "一周内" },
    { k: "far",    t: "更远" },
    { k: "nodate", t: "未注明日期" }
  ];
  function groupOf(x) {
    if (x.days === null) return "nodate";
    if (x.days < 0) return "over";
    if (x.days <= 3) return "urgent";
    if (x.days <= 7) return "soon";
    return "far";
  }

  function itemNode(x) {
    var g = groupOf(x);
    var node = el("div", "item g-" + g + (x.done ? " is-done" : ""));

    var chk = el("button", "chk", x.done ? "✓" : "");
    chk.setAttribute("data-act", "toggle");
    chk.setAttribute("data-id", x.id);
    chk.title = x.done ? "标记为未完成" : "标记为已完成";
    node.appendChild(chk);

    var body = el("div", "body");
    var tdiv = el("div", "t", x.title);
    if (x.src === "ai") tdiv.appendChild(el("span", "ai-badge", "AI"));
    body.appendChild(tdiv);

    var meta = el("div", "meta");
    meta.appendChild(document.createTextNode(dueText(x)));
    var rel = relText(x);
    if (rel) {
      meta.appendChild(document.createTextNode(" · "));
      var span = el("span", (x.days !== null && x.days <= 3) ? "red" : "", rel);
      meta.appendChild(span);
    }
    body.appendChild(meta);

    if (x.materials && x.materials.length) {
      var tags = el("div", "tags");
      x.materials.forEach(function (m) { tags.appendChild(el("span", "tag", "交 " + m)); });
      body.appendChild(tags);
    }

    if (x.source) {
      var det = el("details", "src");
      det.appendChild(el("summary", "", "看原句"));
      det.appendChild(el("p", "", x.source));
      body.appendChild(det);
    }

    node.appendChild(body);

    var del = el("button", "del", "×");
    del.setAttribute("data-act", "del");
    del.setAttribute("data-id", x.id);
    del.title = "删除这条";
    node.appendChild(del);

    return node;
  }

  function render() {
    var all = refreshMeta(current());
    var todo = all.filter(function (x) { return !x.done; });
    var done = all.filter(function (x) { return x.done; });

    /* 顶部统计 */
    if (!all.length) {
      $stats.textContent = "清单还是空的。先粘几条群通知试试。";
    } else {
      var urgent = todo.filter(function (x) { return x.days !== null && x.days >= 0 && x.days <= 3; }).length;
      var over = todo.filter(function (x) { return x.days !== null && x.days < 0; }).length;
      $stats.innerHTML = "";
      $stats.appendChild(document.createTextNode("清单共 " + all.length + " 条 · "));
      $stats.appendChild(el("b", "", "待办 " + todo.length));
      $stats.appendChild(document.createTextNode(" · 3 天内 " + urgent + (over ? " · 已过期 " + over : "") + " · 已完成 " + done.length));
    }

    /* 存储不可用时如实提示，而不是假装正常、刷新后悄悄丢数据 */
    if (!STORAGE_OK) {
      $stats.textContent += " ｜ 浏览器不允许本地保存，关掉页面后清单会丢";
    }

    /* tab 计数 */
    var counts = { todo: todo.length, done: done.length, all: all.length };
    Array.prototype.forEach.call($tabs.children, function (b) {
      var k = b.getAttribute("data-tab");
      var base = k === "todo" ? "待办" : (k === "done" ? "已完成" : "全部");
      b.textContent = base + " " + counts[k];
      b.className = (k === tab ? "on" : "");
    });

    /* 主体 */
    $result.innerHTML = "";
    var list = tab === "todo" ? todo : (tab === "done" ? done : all);

    if (!list.length) {
      var msg = tab === "todo"
        ? (all.length ? "待办都清空了。粘一条新通知继续加。" : "还没有条目。粘几条群通知，点「分析并加入清单」。")
        : (tab === "done" ? "还没有完成的事项。做完一条就勾掉它。" : "清单是空的。");
      $result.appendChild(el("div", "empty", msg));
    } else if (tab === "done") {
      list.slice().reverse().forEach(function (x) { $result.appendChild(itemNode(x)); });
    } else {
      GROUPS.forEach(function (g) {
        var bucket = list.filter(function (x) { return groupOf(x) === g.k; });
        if (!bucket.length) return;
        $result.appendChild(el("div", "group-title", g.t + "（" + bucket.length + "）"));
        bucket.forEach(function (x) { $result.appendChild(itemNode(x)); });
      });
    }

    $ops.style.display = all.length ? "flex" : "none";
  }

  /* ============ 截图输入 ============
     微信截图 → Ctrl+V / 拖进来 / 手机上选相册。
     压缩只为省上传时间：模型那边每张图最多算 1024 token（约 1300×1300），
     所以缩到长边 1800、JPEG 0.9 既看得清字，又不会白花 token。 */
  var IMGS = [];
  var MAX_IMG = 6;
  var imgSeq = 0;

  function compressImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        try {
          var max = 1800;
          var w = img.naturalWidth || 1, h = img.naturalHeight || 1;
          var s = Math.min(1, max / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * s)), ch = Math.max(1, Math.round(h * s));
          var cv = document.createElement("canvas");
          cv.width = cw; cv.height = ch;
          var ctx = cv.getContext("2d");
          ctx.fillStyle = "#fff";           // 透明底直接转 JPEG 会变黑，先铺白
          ctx.fillRect(0, 0, cw, ch);
          ctx.drawImage(img, 0, 0, cw, ch);
          URL.revokeObjectURL(url);
          resolve(cv.toDataURL("image/jpeg", 0.9));
        } catch (e) { reject(new Error("浏览器处理不了这张图")); }
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("这张图打不开")); };
      img.src = url;
    });
  }

  function renderThumbs() {
    $thumbs.innerHTML = "";
    $thumbs.hidden = !IMGS.length;
    IMGS.forEach(function (im) {
      var box = document.createElement("div");
      box.className = "thumb";
      var pic = document.createElement("img");
      pic.src = im.dataUrl;
      pic.alt = "聊天截图";
      var del = document.createElement("button");
      del.type = "button";
      del.textContent = "×";
      del.setAttribute("aria-label", "删掉这张图");
      del.addEventListener("click", function () {
        IMGS = IMGS.filter(function (x) { return x.id !== im.id; });
        renderThumbs();
      });
      box.appendChild(pic);
      box.appendChild(del);
      $thumbs.appendChild(box);
    });
  }

  function addImages(files) {
    var list = Array.prototype.slice.call(files || []).filter(function (f) {
      return f && /^image\//.test(f.type || "");
    });
    if (!list.length) { alert("只认图片文件（截图、照片都行）。"); return; }
    var room = MAX_IMG - IMGS.length;
    if (room <= 0) { alert("一次最多 " + MAX_IMG + " 张，先删掉几张再加。"); return; }
    if (list.length > room) list = list.slice(0, room);
    if (list.some(function (f) { return f.size > 12 * 1024 * 1024; })) {
      alert("有图片超过 12MB，先裁掉一部分再试。");
      return;
    }
    Promise.all(list.map(compressImage)).then(function (urls) {
      urls.forEach(function (u) { IMGS.push({ id: "img" + (++imgSeq), dataUrl: u }); });
      renderThumbs();
    }).catch(function (e) { alert("图片处理失败：" + e.message); });
  }

  /* ============ AI 增强层（DeepSeek） ============
     原则：AI 是增强，不是命脉。
     - 没填 Key：纯规则，断网可用
     - 填了 Key 但超时/失败/被跨域拦：自动回退规则，界面不报红，只在状态栏说明
     模型说明（2026-11 核对官方文档）：
     - 模型名用 deepseek-flash。旧的 deepseek-chat 已于 2026/07/24 弃用。
     - deepseek-flash 默认开启思考模式，会让抽取变慢变贵，这里显式关闭。 */
  var AI = {
    name: "DeepSeek",
    url: "https://api.deepseek.com/chat/completions",
    model: "deepseek-flash"
  };
  var AI_STORE = "deadline-radar:ai";

  function setAiStatus(msg, cls) {
    $aiStat.textContent = msg;
    $aiStat.className = "ai-state" + (cls ? " " + cls : "");
  }
  /* 折叠状态下一眼看出 AI 通没通，答辩前不用点开面板检查 */
  function syncAiSum() {
    var ok = !!($aiKey.value || "").trim();
    $aiSum.textContent = ok ? "· 已就绪" : "· 未接入，纯本地规则";
    $aiSum.className = "ai-sum" + (ok ? " on" : "");
  }
  function ymdCN(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }

  /* 把 HTTP 状态码翻译成用户能看懂、能自己动手解决的话 */
  function friendlyErr(status, body) {
    var b = String(body || "");
    if (status === 401 || status === 403) return "Key 不对或已失效，去 platform.deepseek.com 重新创建一个";
    if (status === 402) return "DeepSeek 账户余额不足，去 platform.deepseek.com 充值后再试";
    if (status === 429) return "请求太频繁或额度用尽，等几十秒再试";
    if (status === 400 || status === 404) return "请求被拒（HTTP " + status + "）：" + b.replace(/\s+/g, " ").slice(0, 60);
    if (status >= 500) return "DeepSeek 服务端出错（HTTP " + status + "），稍后再试";
    return "HTTP " + status + " " + b.replace(/\s+/g, " ").slice(0, 60);
  }

  function aiPrompt(text, nImg) {
    var head = "今天是 " + ymdCN(new Date()) + "。\n";
    if (nImg) {
      head += "下面是微信群聊的截图，共 " + nImg + " 张。读图时守这几条：\n" +
        "· 每条消息旁的昵称和发送时间是「相对时间」的换算基准，不要拿今天去算。\n" +
        "· 多张图可能拍到同一段消息，重复的只留一条。\n" +
        "· 表情、红包、文件大小、「以下是新消息」这类系统提示都不是待办。\n" +
        "· 图里的日期分隔线（昨天 / 星期三）可以拿来推算，但结论要落到具体日期。\n";
    } else {
      head += "下面是一段真实的微信群聊天记录，可能包含「昵称 + 发送时间」的消息头、表情、链接、附件和闲聊。\n";
    }
    return head +
      "请从中找出所有「要在某个时间点之前完成的事」，整理成待办。\n" +
      "要求：\n" +
      "1. title：一句话说清要做什么，20 字以内，用动词开头，要概括不要照抄原句，不要带昵称、@、表情。\n" +
      "2. due：截止日期 YYYY-MM-DD。相对时间（今天/明天/下周三/月底）必须按该条消息的发送时间换算，不要按今天算。\n" +
      "3. time：截止时刻 HH:MM，没写就 null；区间日期（如 11月2日8:00—11月7日24:00）取结束时间。\n" +
      "4. materials：真正要提交或携带的东西，字符串数组，没有就 []。不要写「链接」「通知」「材料」。\n" +
      "5. source：最能支撑这条待办的那句原文，原样截取，不要改写。\n" +
      "6. 一句话里有多件事就拆成多条；纯闲聊、通知转发、单纯让人进群、已经明显过期的，不要收录。\n" +
      "只输出一个 json 对象，不要解释，不要代码块：\n" +
      '{"items":[{"title":"","due":"YYYY-MM-DD","time":"HH:MM","materials":[],"source":""}]}\n\n' +
      (String(text || "").trim() ? "聊天记录（文字）：\n" + text : "（这次没有文字，只按上面的截图处理）");
  }

  function callAI(text, key, images) {
    var imgs = images || [];
    var wait = imgs.length ? 60000 : 30000;   // 图片要多给时间：上传 + 读图
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, wait);

    /* 图片必须以「内容块数组」形式放进 user 消息；放 system 里会 400 */
    var content;
    if (imgs.length) {
      content = [{ type: "text", text: aiPrompt(text, imgs.length) }];
      imgs.forEach(function (im) {
        content.push({ type: "image_url", image_url: { url: im.dataUrl, detail: "original" } });
      });
    } else {
      content = aiPrompt(text, 0);
    }

    return fetch(AI.url, {
      method: "POST",
      signal: ctrl.signal,
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
      body: JSON.stringify({
        model: AI.model,
        temperature: 0,
        max_tokens: 4096,
        response_format: { type: "json_object" },
        thinking: { type: "disabled" },
        messages: [
          { role: "system", content: "你是中文信息抽取器，只输出 json，不输出任何解释。" },
          { role: "user", content: content }
        ]
      })
    }).then(function (res) {
      clearTimeout(timer);
      if (!res.ok) {
        return res.text().then(function (t) {
          throw new Error(friendlyErr(res.status, t));
        });
      }
      return res.json();
    }).then(function (data) {
      var s = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      // JSON 模式下模型偶尔会把无法识别的内容替换成空格，content 可能看起来是空的
      if (!s || !String(s).trim()) throw new Error("模型这次没返回内容，再点一次就好");
      s = String(s).replace(/```json|```/g, "").trim();
      var i = s.indexOf("{"), j = s.lastIndexOf("}");
      if (i >= 0 && j > i) s = s.slice(i, j + 1);
      var obj;
      try { obj = JSON.parse(s); } catch (e) { throw new Error("模型返回的不是合法 JSON，再点一次就好"); }
      var arr = Array.isArray(obj) ? obj : (obj.items || []);
      return arr.map(function (x) {
        var t = String(x.time || "");
        return {
          title: String(x.title || "").trim(),
          due: /^\d{4}-\d{2}-\d{2}$/.test(x.due) ? x.due : null,
          time: /^\d{1,2}:\d{2}$/.test(t) ? pad(+t.split(":")[0]) + ":" + t.split(":")[1] : null,
          materials: Array.isArray(x.materials) ? x.materials.filter(Boolean).map(String) : [],
          source: String(x.source || "").trim(),
          src: "ai"
        };
      }).filter(function (x) { return x.title; });
    }).catch(function (e) {
      clearTimeout(timer);
      if (e && e.name === "AbortError") throw new Error("超时 " + (wait / 1000) + " 秒");
      if (e instanceof TypeError) throw new Error("网络不通或被跨域拦截");
      throw e;
    });
  }

  /* AI 条目优先，规则条目补漏：同一条只留一个，AI 缺日期就用规则算出的补上 */
  function normKey(t) { return String(t || "").replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, "").slice(0, 12); }
  function mergeFresh(aiItems, ruleItems) {
    var out = aiItems.slice();
    ruleItems.forEach(function (r) {
      var rk = normKey(r.title), hit = null, i, ok;
      for (i = 0; i < out.length; i++) {
        ok = normKey(out[i].title);
        if (!ok || !rk) continue;
        if (ok.indexOf(rk) >= 0 || rk.indexOf(ok) >= 0) { hit = out[i]; break; }
      }
      if (hit) {
        if (!hit.due && r.due) { hit.due = r.due; hit.time = hit.time || r.time; }
        if (!hit.source) hit.source = r.source;
        if ((!hit.materials || !hit.materials.length) && r.materials.length) hit.materials = r.materials;
        return;
      }
      out.push(r);
    });
    return out;
  }

  function loadAiCfg() {
    try {
      var c = JSON.parse(localStorage.getItem(AI_STORE) || "null");
      if (c && c.key) {
        $aiKey.value = c.key;
        $aiRem.checked = true;
        setAiStatus("已记住 Key，当前：AI 概括 + 规则兜底（" + AI.model + "）。", "on");
      }
    } catch (e) {}
    syncAiSum();
  }
  function saveAiCfg() {
    try {
      if ($aiRem.checked && $aiKey.value.trim()) {
        localStorage.setItem(AI_STORE, JSON.stringify({ key: $aiKey.value.trim() }));
      } else {
        localStorage.removeItem(AI_STORE);
      }
    } catch (e) {}
    syncAiSum();
  }

  /* ============ 交互 ============ */
  $result.addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!btn) return;
    var id = btn.getAttribute("data-id");
    var act = btn.getAttribute("data-act");
    var all = current();
    var i;
    for (i = 0; i < all.length; i++) if (all[i].id === id) break;
    if (i >= all.length) return;

    if (act === "toggle") {
      all[i].done = !all[i].done;
      save(all);
      render();
    } else if (act === "del") {
      all.splice(i, 1);
      save(all);
      render();
    }
  });

  $tabs.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("[data-tab]") : null;
    if (!b) return;
    tab = b.getAttribute("data-tab");
    render();
  });

  function finish(fresh, note, isErr) {
    busy = false;
    $run.disabled = false;
    $run.textContent = "分析并加入清单";
    if (note) setAiStatus(note, isErr ? "err" : "on");
    if (!fresh.length) {
      if (IMGS.length) {
        alert("这次没抽出条目。可以试试：\n① 截图只留通知那几条，把闲聊裁掉\n② 顺便把关键文字也粘一点进来\n③ 再点一次（模型偶尔会空手而归）");
      } else {
        alert("没找到「什么时候要做什么」的句子。\n\n两个办法：\n① 原文里带上时间词（本周五 18:00 前、11 月 13 日前）\n② 在上面「AI 概括」里填一个 DeepSeek Key，让模型帮你概括");
      }
      return;
    }
    var added = mergeItems(fresh);
    var dup = fresh.length - added;
    $input.value = "";
    IMGS = [];
    renderThumbs();
    try { localStorage.removeItem(STORE_INPUT); } catch (e) {}
    tab = "todo";
    render();
    if (!added) alert("这批 " + fresh.length + " 条都已经在清单里了，没有重复添加。");
    else if (dup) alert("加入 " + added + " 条，" + dup + " 条已存在被跳过。");
  }

  function run() {
    if (busy) return;
    var text = $input.value;
    var hasImg = IMGS.length > 0;

    if (!text.trim() && !hasImg) {
      alert("先粘几条群通知，或者直接 Ctrl + V 粘一张聊天截图。也可以点「填入示例」看效果。");
      $input.focus();
      return;
    }

    // 规则只认得文字；纯截图时它没有输入，只能等 AI
    var ruleItems = [];
    try { if (text.trim()) ruleItems = extract(text); } catch (e) {}

    var key = ($aiKey.value || "").trim();

    // 截图必须走 AI。本地规则读不了图，必须明说，不能默默失败
    if (hasImg && !key) {
      $aiBox.open = true;
      setAiStatus("截图要靠 AI 读，先在下面填一个 DeepSeek Key。", "err");
      $aiKey.focus();
      return;
    }

    if (!key) { finish(ruleItems, "本地规则模式：只摘句、不概括。填入 Key 可让 AI 概括成一句话待办。", false); return; }

    busy = true;
    $run.disabled = true;
    $run.textContent = hasImg ? "AI 读图中…" : "AI 分析中…";
    callAI(text, key, IMGS).then(function (items) {
      saveAiCfg();
      finish(mergeFresh(items, ruleItems),
        "AI 概括完成：" + items.length + " 条（" + AI.name + " · " + AI.model +
        (hasImg ? "，含 " + IMGS.length + " 张截图" : "") + "）", false);
    }).catch(function (err) {
      finish(ruleItems, "AI 没调通（" + err.message + "）" +
        (hasImg ? "，截图没读成。" : "，已自动改用本地规则，结果仍然可用。"), true);
    });
  }

  $run.addEventListener("click", run);

  /* ---- 截图入口：按钮 / 文件选择 / 粘贴 / 拖拽，四条路都通 ---- */
  $pick.addEventListener("click", function () { $file.click(); });

  $file.addEventListener("change", function () {
    addImages($file.files);
    $file.value = "";               // 允许连续选同一张
  });

  document.addEventListener("paste", function (e) {
    var cd = e.clipboardData;
    if (!cd) return;
    var items = cd.items || [];
    var files = [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === "file" && /^image\//.test(items[i].type || "")) {
        var f = items[i].getAsFile();
        if (f) files.push(f);
      }
    }
    if (!files.length) return;       // 粘的是文字，交给输入框自己处理
    e.preventDefault();
    addImages(files);
  });

  ["dragenter", "dragover"].forEach(function (ev) {
    document.addEventListener(ev, function (e) {
      if (!e.dataTransfer) return;
      e.preventDefault();
      $inCard.classList.add("dragging");
    });
  });
  ["dragleave", "dragend"].forEach(function (ev) {
    document.addEventListener(ev, function () { $inCard.classList.remove("dragging"); });
  });
  document.addEventListener("drop", function (e) {
    if (!e.dataTransfer) return;
    var files = e.dataTransfer.files;
    $inCard.classList.remove("dragging");
    if (!files || !files.length) return;
    var anyImg = false;
    for (var i = 0; i < files.length; i++) if (/^image\//.test(files[i].type || "")) anyImg = true;
    if (!anyImg) return;
    e.preventDefault();
    addImages(files);
  });

  /* 输入 Key 时标题立刻变「已就绪」，不必等测试 */
  $aiKey.addEventListener("input", syncAiSum);

  $clear.addEventListener("click", function () {
    $input.value = "";
    IMGS = [];
    renderThumbs();
    try { localStorage.removeItem(STORE_INPUT); } catch (e) {}
    $input.focus();
  });

  $sample.addEventListener("click", function () {
    $input.value = [
      "【学工办】请各班班长于下周五 18:00 前将《创新学分汇总表》电子版发送至学工办邮箱，逾期不予受理。",
      "【教务】请于 2026 年 11 月 13 日前完成本学期评教，未完成的同学将影响成绩查询。",
      "各位同学注意：下周三上午 9 点在三号楼 302 开会，记得带上学生证和一份个人简历。",
      "关于奖学金申请的通知：符合条件的同学请在 11 月 20 日之前提交申请表和成绩单扫描件到辅导员处。",
      "明天中午 12 点前把宿舍卫生检查表交到生活委员那里。",
      "本学期读书笔记请于月底前提交至学习通。"
    ].join("\n");
    $input.focus();
  });

  document.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") run();
  });

  $input.addEventListener("input", function () {
    try { localStorage.setItem(STORE_INPUT, $input.value); } catch (e) {}
  });

  /* ============ 导出：只导未完成且有日期的 ============ */
  function icsEscape(s) {
    return String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
  }
  function fold(line) {
    if (line.length <= 72) return line;
    var out = line.slice(0, 72), rest = line.slice(72);
    while (rest.length) { out += "\r\n " + rest.slice(0, 71); rest = rest.slice(71); }
    return out;
  }

  $ics.addEventListener("click", function () {
    var list = refreshMeta(current()).filter(function (x) { return !x.done && x.due; });
    if (!list.length) {
      alert("没有「未完成且写了日期」的条目。先勾掉做完的，或者确认通知里写了截止时间。");
      return;
    }

    var now = new Date();
    var stamp = now.getUTCFullYear() + pad(now.getUTCMonth() + 1) + pad(now.getUTCDate()) + "T" +
                pad(now.getUTCHours()) + pad(now.getUTCMinutes()) + pad(now.getUTCSeconds()) + "Z";

    var L = [
      "BEGIN:VCALENDAR", "VERSION:2.0",
      "PRODID:-//Deadline Radar//HENU HACK 2026//CN",
      "CALSCALE:GREGORIAN", "METHOD:PUBLISH"
    ];

    list.forEach(function (x, idx) {
      var d0 = parseYmd(x.due), d1 = addDays(d0, 1);
      L.push("BEGIN:VEVENT");
      L.push("UID:" + stamp + "-" + idx + "@deadline-radar");
      L.push("DTSTAMP:" + stamp);
      L.push("DTSTART;VALUE=DATE:" + ymdCompact(d0));
      L.push("DTEND;VALUE=DATE:" + ymdCompact(d1));
      L.push(fold("SUMMARY:" + icsEscape("截止 · " + x.title + (x.time ? " " + x.time : ""))));
      L.push(fold("DESCRIPTION:" + icsEscape(
        (x.materials && x.materials.length ? "要交：" + x.materials.join("、") + "\n" : "") + "原句：" + x.source
      )));
      L.push("BEGIN:VALARM");
      L.push("TRIGGER:-PT12H");
      L.push("ACTION:DISPLAY");
      L.push(fold("DESCRIPTION:" + icsEscape("明天截止：" + x.title)));
      L.push("END:VALARM");
      L.push("END:VEVENT");
    });
    L.push("END:VCALENDAR");

    var blob = new Blob([L.join("\r\n")], { type: "text/calendar;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "截止日雷达.ics";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  });

  /* ============ 导出：复制成文本（只复制待办） ============ */
  $copy.addEventListener("click", function () {
    var list = refreshMeta(current()).filter(function (x) { return !x.done; });
    if (!list.length) { alert("待办是空的，没有可复制的内容。"); return; }

    var btn = $copy;
    var text = "【截止日清单】\n" + list.map(function (x) {
      return "· " + (x.due ? x.due + (x.time ? " " + x.time : "") : "未注明") + "  " + x.title +
        (x.materials && x.materials.length ? "（交：" + x.materials.join("、") + "）" : "");
    }).join("\n");

    function ok() {
      var t = btn.textContent;
      btn.textContent = "已复制 ✓";
      setTimeout(function () { btn.textContent = t; }, 1500);
    }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); ok(); } catch (e) { alert("复制失败，请手动选中文字"); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, fallback);
    } else { fallback(); }
  });

  /* ============ 清空全部 ============ */
  $wipe.addEventListener("click", function () {
    var n = current().length;
    if (!n) return;
    if (!confirm("确定清空全部 " + n + " 条清单？这个操作不能撤销。")) return;
    save([]);
    render();
  });

  /* ============ 测试 AI 连接 ============ */
  $aiTest.addEventListener("click", function () {
    var key = ($aiKey.value || "").trim();
    if (!key) { setAiStatus("先填 Key 再测试。", "err"); $aiKey.focus(); return; }
    $aiTest.disabled = true;
    setAiStatus("测试中…（最多 30 秒）", "");
    callAI("【测试】请于明天下午 3 点前交一份活动总结。", key).then(function (items) {
      $aiTest.disabled = false;
      saveAiCfg();
      if (!items.length) { setAiStatus("通了，但模型没抽出条目。再点一次试试。", "err"); return; }
      setAiStatus("连接成功：" + AI.name + " · " + AI.model + "，识别到「" + items[0].title + "」。", "on");
    }).catch(function (err) {
      $aiTest.disabled = false;
      setAiStatus("失败：" + err.message, "err");
    });
  });

  /* ============ 启动 ============ */
  try {
    var saved = localStorage.getItem(STORE_INPUT);
    if (saved) $input.value = saved;
  } catch (e) {}

  loadAiCfg();
  render();
})();
</script>
</body>
</html>
