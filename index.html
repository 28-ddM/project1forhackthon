<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>截止日雷达 · 群消息变截止日清单</title>
<style>
/* ===== 主题变量：lfl 想换风格，只改这一段就够了 ===== */
:root {
  /* 奶龙暖黄：低饱和、不刺眼。整套页只动这一段。 */
  --accent: #f0b429;       /* 品牌主色：奶黄 */
  --accent-deep: #d99a1c;  /* 主色 hover 变暗 */
  --accent-soft: #fdeccb;  /* 主色浅底 */

  --ink: #3a332c;          /* 主文字：暖深棕，不是纯黑 */
  --ink-deep: #2a241e;     /* 主按钮 hover：只变暗，不变色不上浮 */
  --on-ink: #fffdf8;       /* 压在深色上的文字 */
  --ink-2: #574f44;        /* 次一级文字 */
  --muted: #8a8175;        /* 说明文字 */
  --muted-2: #a39a8c;      /* 分组标题 */
  --muted-3: #6b6257;      /* 标签文字、折叠标题 */
  --src: #8f8577;          /* 原文出处 */
  --faint: #b3aa9c;        /* 辅助 / 占位 */

  --line: #efe6d4;         /* 卡片描边、分隔线 */
  --line-2: #e2d7c0;       /* 输入框与按钮描边 */
  --line-3: #e8dcc6;       /* 事项卡片左边框、缩略图、空状态虚线 */

  --bg: #faf5ea;           /* 页面底：暖米白 */
  --surface: #fffdf8;      /* 卡片底：奶白 */
  --surface-2: #f6f0e1;    /* 浅底块（原文出处、提示条） */
  --surface-3: #faf5ea;    /* 已完成项 */
  --tag-bg: #f3ead6;       /* 标签底色 */

  --danger: #d97a6c;       /* 紧急、删除、错误：低饱和柔和红 */
  --danger-line: #ecc9c2;
  --warn: #d9a13b;         /* 一周内：柔和橙黄 */
  --ok: #6ba883;           /* 成功：柔和绿，低饱和 */
  --ok-line: #c9e0d2;
  --ok-bg: #f2f7f0;
  --link: #d97706;         /* 链接：和品牌橙统一 */

  --radius: 16px;          /* 卡片圆角：整套统一 16 */
  --radius-sm: 10px;       /* 小圆角 */
  --shadow-sm: 0 1px 2px rgba(58, 51, 44, .07);   /* 全站只用这一种阴影 */
}

/* ① 样式：视觉规范 = 8px 栅格 / 16px 统一圆角 / 只用 shadow-sm / 200ms ease
   换配色只动上面的 :root；下面不要再写新的圆角数值、阴影或渐变。 */
* { box-sizing: border-box; }
body {
  margin: 0; padding: 24px 16px 48px;
  font: 400 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  color: var(--ink); background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 960px; margin: 0 auto; }
h1 { font-size: 26px; font-weight: 600; letter-spacing: .5px; margin: 0 0 4px; }
.slogan { margin: 0 0 8px; font-size: 17px; font-weight: 600; color: var(--accent-deep); }
.sub { margin: 0 0 16px; color: var(--muted); font-size: 14px; font-weight: 350; }
.stats {
  font-size: 14px; font-weight: 350; color: var(--ink-2); background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px 16px; margin-bottom: 16px; box-shadow: var(--shadow-sm);
}
.stats b { color: var(--danger); }
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 16px; margin-bottom: 16px;
  box-shadow: var(--shadow-sm); transition: border-color 200ms ease;
}
.card:hover { border-color: var(--line-2); }   /* 只轻微加深边框：不放大、不上浮、不弹跳 */
textarea {
  width: 100%; height: 128px; padding: 12px;
  font: inherit; font-size: 15px; line-height: 1.5;
  color: var(--ink); background: var(--surface);
  border: 1px solid var(--line-2); border-radius: var(--radius-sm); resize: vertical;
  transition: border-color 200ms ease;
}
textarea::placeholder { color: var(--faint); }
textarea:focus { outline: none; border-color: var(--accent); }
.row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
button {
  font: inherit; font-size: 15px; font-weight: 400; padding: 9px 16px;
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
  border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap;
  transition: background-color 200ms ease, border-color 200ms ease, color 200ms ease;
}
button:hover { background: var(--surface-2); border-color: var(--faint); }  /* 只变暗 */
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
button.primary:hover { background: var(--ink-deep); border-color: var(--ink-deep); }
.hint { font-size: 13px; font-weight: 350; color: var(--faint); margin: 10px 0 0; }
/* 截图缩略图：粘一张就能看一张，粘错了能删 */
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.thumb {
  position: relative; width: 84px; height: 84px;
  border: 1px solid var(--line-3); border-radius: var(--radius-sm);
  overflow: hidden; background: var(--surface-3);
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb button {
  position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; padding: 0;
  border: none; border-radius: 50%;   /* 唯一的圆形：关闭按钮，功能需要 */
  background: rgba(58,51,44,.72); color: var(--on-ink);
  font-size: 14px; line-height: 1; cursor: pointer;
}
.card.dragging { border-color: var(--accent); background: var(--accent-soft); }
.tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.tabs button { font-size: 14px; padding: 7px 16px; }
.tabs button.on {
  background: var(--accent-soft); color: var(--ink);
  border-color: var(--accent); font-weight: 600;
}
.group-title {
  font-size: 13px; font-weight: 350; color: var(--muted-2); margin: 16px 0 8px;
  display: flex; align-items: center; gap: 8px;
}
.group-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.item {
  display: flex; gap: 12px; align-items: flex-start;
  background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line-3);
  border-radius: var(--radius); padding: 12px 16px; margin-bottom: 8px;
  box-shadow: var(--shadow-sm);
  transition: border-top-color 200ms ease, border-right-color 200ms ease, border-bottom-color 200ms ease;
}
/* hover 只动另外三条边，左边框颜色必须留给紧急程度 */
.item:hover {
  border-top-color: var(--line-2); border-right-color: var(--line-2); border-bottom-color: var(--line-2);
}
/* 左边框颜色 = 紧急程度。类名必须和 JS 里 groupOf() 的返回值一致：
   urgent(3天内) / soon(一周内) / far(更远) / over(已过期) / nodate(未写日期) */
.item.g-urgent { border-left-color: var(--danger); }
.item.g-soon   { border-left-color: var(--warn); }
.item.g-far    { border-left-color: var(--ok); }
.item.g-over   { border-left-color: var(--faint); }
.item.g-nodate { border-left-color: var(--line-3); }
.item.is-done { background: var(--surface-3); }
.item.is-done .t { text-decoration: line-through; color: var(--faint); }
.chk {
  flex: 0 0 auto; width: 28px; height: 28px; padding: 0;
  font-size: 16px; line-height: 1; border-radius: var(--radius-sm);
}
.body { flex: 1; min-width: 0; }
.t { font-size: 16px; font-weight: 600; word-break: break-word; }
/* 日期是最重要的一行，从灰色小字里提出来，让它自己成一层 */
.meta { font-size: 14px; font-weight: 500; color: var(--ink-2); margin-top: 4px; }
.meta .red { color: var(--danger); font-weight: 600; }
.tags { margin-top: 8px; }
.tag {
  display: inline-block; font-size: 12px; font-weight: 350; color: var(--muted-3);
  background: var(--tag-bg); border-radius: var(--radius-sm);
  padding: 2px 8px; margin: 0 4px 4px 0;
}
details.src { margin-top: 8px; }
details.src summary {
  font-size: 12px; font-weight: 350; color: var(--faint); cursor: pointer;
  list-style: none; padding: 2px 0;
}
details.src summary::-webkit-details-marker { display: none; }
details.src summary::before { content: "▸ "; }
details.src[open] summary::before { content: "▾ "; }
details.src p {
  font-size: 12px; color: var(--src); margin: 4px 0 0; padding: 8px 10px;
  background: var(--surface-2); border-radius: var(--radius-sm);
}
.del {
  flex: 0 0 auto; border: none; background: none; color: var(--line-2);
  font-size: 20px; line-height: 1; padding: 2px 4px; cursor: pointer;
}
.del:hover { color: var(--danger); background: none; }
/* 空状态：只在清单完全为空时放一只托腮奶龙，别的地方不铺插图 */
.empty {
  color: var(--muted); font-size: 14px; font-weight: 350;
  padding: 24px 16px; text-align: center;
  background: var(--surface); border: 1px dashed var(--line-3);
  border-radius: var(--radius);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.empty img.mascot {
  width: 96px; height: 96px; object-fit: contain;
  border-radius: var(--radius);
  /* 图已抠成透明底并内联，不需要 mix-blend-mode，也不会出现白方块 */
}
.empty .empty-msg { max-width: 340px; }
.ops { display: flex; gap: 8px; flex-wrap: wrap; }
.ops .danger { color: var(--danger); border-color: var(--danger-line); }
details.ai summary {
  cursor: pointer; font-size: 14px; font-weight: 600; color: var(--muted-3); list-style: none;
}
details.ai summary::-webkit-details-marker { display: none; }
details.ai summary::before { content: "▸ "; }
details.ai[open] summary::before { content: "▾ "; }
.ai-sum { font-size: 12px; font-weight: 350; color: var(--faint); }
.ai-sum.on { color: var(--ok); }
.ai-row { margin-top: 12px; }
.ai-row label { display: block; font-size: 13px; font-weight: 350; color: var(--muted); }
.ai-row select, .ai-row input[type=password], .ai-row input[type=text] {
  width: 100%; margin-top: 4px; padding: 8px 12px; font: inherit; font-size: 14px;
  color: var(--ink); border: 1px solid var(--line-2);
  border-radius: var(--radius-sm); background: var(--surface);
}
.ai-ck { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 350; color: var(--muted); }
.ai-tip {
  font-size: 12px; font-weight: 350; line-height: 1.65; color: var(--muted-2);
  margin: 12px 0 0; padding: 8px 12px;
  background: var(--surface-2); border-radius: var(--radius-sm);
}
.ai-tip a { color: var(--link); }
.ai-tip code { font-size: 11px; background: var(--tag-bg); padding: 1px 4px; border-radius: var(--radius-sm); }
.ai-state { font-size: 13px; font-weight: 350; margin: 12px 0 0; color: var(--muted); }
.ai-state.on { color: var(--ok); }
.ai-state.err { color: var(--danger); }
.ai-badge {
  font-size: 11px; font-weight: 400; color: var(--ok);
  border: 1px solid var(--ok-line); background: var(--ok-bg);
  border-radius: var(--radius-sm); padding: 0 4px; margin-left: 6px; vertical-align: 2px;
}
/* ===== 提示与确认 =====
   不用 alert()/confirm()：浏览器原生框在手机上常是系统深色样式，和页面完全割裂，
   而且会打断操作。这里换成页面内的轻提示和自定义确认框，样式跟着主题变量走。 */
.toast-wrap {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
  z-index: 99; width: min(92vw, 460px);
  display: flex; flex-direction: column; gap: 8px; align-items: center;
  pointer-events: none;
  padding-bottom: env(safe-area-inset-bottom);
}
.toast {
  background: var(--ink); color: var(--on-ink);
  font-size: 14px; font-weight: 400; line-height: 1.65; white-space: pre-line;
  padding: 10px 16px; border-radius: var(--radius-sm);
  border: 1px solid var(--ink-deep);
  box-shadow: var(--shadow-sm);   /* 全站只用这一种阴影 */
  max-width: 100%;
  animation: toastIn 200ms ease;
}
@keyframes toastIn { from { opacity: 0; } to { opacity: 1; } }
.toast.out { opacity: 0; transition: opacity 200ms ease; }

.mask {
  position: fixed; inset: 0; z-index: 100; padding: 24px;
  background: rgba(58,51,44,.32);
  display: flex; align-items: center; justify-content: center;
}
.mask[hidden] { display: none; }
.dialog {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius);
  width: min(92vw, 360px); padding: 24px;
  box-shadow: var(--shadow-sm);
}
.dialog p { margin: 0 0 16px; font-size: 15px; line-height: 1.65; color: var(--ink); white-space: pre-line; }
.dialog .row { margin-top: 0; }
.dialog .row button { flex: 1 1 0; }

/* 电脑端：加宽留白，行距更舒展；手机端保持紧凑 */
@media (min-width: 900px) {
  body { padding: 32px 24px 64px; }
  h1 { font-size: 30px; }
  .card { padding: 24px; }
  textarea { height: 160px; }
}
@media (max-width: 480px) {
  body { padding: 16px 12px 32px; }
  h1 { font-size: 22px; }
  .slogan { font-size: 15px; }
  button { font-size: 14px; padding: 9px 12px; }
  .row button { flex: 1 1 auto; }
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>截止日雷达</h1>
    <p class="slogan">别让群里的通知，悄悄溜走。</p>
    <p class="sub">把班级群、社团群的通知粘进来，或者截个图丢进来，自动整理成一份不会错过的截止日清单。</p>
    <div class="stats" id="stats">清单还是空的。先粘几条群通知试试。</div>
  </header>

  <!-- ② 结构：新增/删除带 id 的元素前先跟写 JS 的人说一声 -->
  <section class="card" id="inputCard">
    <textarea id="input" placeholder="把群消息整段粘进来，或者直接 Ctrl + V 粘贴聊天截图、把图片拖进来。&#10;比如：【学工办】请各班班长于下周五 18:00 前将《创新学分汇总表》发到学工办邮箱。"></textarea>
    <div class="thumbs" id="thumbs" hidden></div>
    <div class="row">
      <button id="run" class="primary">分析并加入清单</button>
      <button id="clip">读取剪贴板</button>
      <button id="pick">图片选取</button>
      <button id="sample">填入示例</button>
      <button id="clear">清空输入</button>
    </div>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <p class="hint">Ctrl + Enter 也能分析。聊天截图可以直接 Ctrl + V 或拖进来（最多 6 张，需填 Key）。数据只存在你自己的浏览器里，不上传。</p>
  </section>

  <!-- AI 概括层：DeepSeek。不填 Key 就是纯本地规则，断网也能用 -->
  <details class="card ai" id="aibox">
    <summary>AI 概括（DeepSeek）<span class="ai-sum" id="aiSum">· 未接入</span></summary>
    <p class="ai-tip">
      去 <a href="https://platform.deepseek.com/api_keys" target="_blank" rel="noopener">platform.deepseek.com</a>
      创建 Key（<code>sk-</code> 开头，需账户有余额，一次分析约几分钱）。<br>
      Key 只存在你自己的浏览器里，不写进代码、不上传。
    </p>
    <div class="ai-row">
      <label>API Key
        <input id="aiKey" type="password" autocomplete="off" placeholder="粘贴 sk- 开头的 Key">
      </label>
    </div>
    <div class="row">
      <button id="aiTest">测试连接</button>
      <label class="ai-ck"><input type="checkbox" id="aiRemember"> 在这台设备记住</label>
    </div>
    <p class="ai-state" id="aiStatus">当前：本地规则模式。断网可用，但只会「摘句」，不会「概括」。</p>
  </details>

  <nav class="tabs" id="tabs">
    <button data-tab="todo" class="on">待办</button>
    <button data-tab="done">已完成</button>
    <button data-tab="all">全部</button>
  </nav>

  <section id="result"></section>

  <section class="card ops" id="ops" style="display:none">
    <button id="ics">下载日历文件 .ics</button>
    <button id="copy">复制成清单</button>
    <button id="wipe" class="danger">清空全部清单</button>
  </section>

</div>

<!-- 轻提示与确认框：替代 alert / confirm，样式跟主题走 -->
<div class="toast-wrap" id="toastWrap" aria-live="polite"></div>
<div class="mask" id="mask" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgText">
    <p id="dlgText"></p>
    <div class="row">
      <button id="dlgNo" type="button">取消</button>
      <button id="dlgYes" class="primary" type="button">确定</button>
    </div>
  </div>
</div>

<script>
/* ③ 逻辑：技术操盘手独占改这一块 */
(function () {
  "use strict";

  var $input  = document.getElementById("input");
  var $run    = document.getElementById("run");
  var $clear  = document.getElementById("clear");
  var $sample = document.getElementById("sample");
  var $clip   = document.getElementById("clip");
  var $pick   = document.getElementById("pick");
  var $file   = document.getElementById("file");
  var $thumbs = document.getElementById("thumbs");
  var $inCard = document.getElementById("inputCard");
  var $result = document.getElementById("result");
  var $stats  = document.getElementById("stats");
  var $tabs   = document.getElementById("tabs");
  var $ops    = document.getElementById("ops");
  var $ics    = document.getElementById("ics");
  var $copy   = document.getElementById("copy");
  var $wipe   = document.getElementById("wipe");
  var $aiBox  = document.getElementById("aibox");
  var $aiKey  = document.getElementById("aiKey");
  var $aiTest = document.getElementById("aiTest");
  var $aiRem  = document.getElementById("aiRemember");
  var $aiStat = document.getElementById("aiStatus");
  var $aiSum  = document.getElementById("aiSum");
  var $toastW = document.getElementById("toastWrap");
  var $mask   = document.getElementById("mask");
  var $dlgTxt = document.getElementById("dlgText");
  var $dlgYes = document.getElementById("dlgYes");
  var $dlgNo  = document.getElementById("dlgNo");

  var STORE_INPUT = "deadline-radar:input";     // 输入框草稿
  var STORE_ITEMS = "deadline-radar:items";     // 累积清单（PRD 8. 数据契约）
  var MS_DAY = 86400000;

      var base = msg.sentAt || today;
      var raw = msg.body.join("\n");
      if (!raw.trim()) return;

      // ① 去掉链接：URL 里的 t20260313 会被误认成日期
      var clean = raw.replace(/https?:\/\/[^\s，。；）】"']+/g, " ");

      // ② 切成句子，附件行整行丢掉
      var segs = [];
      clean.split(/\n/).forEach(function (line) {
        var t = line.trim();
        if (!t) return;
        if (/^\[(图片|文件|视频|语音|动画表情|表情)\]/.test(t)) return;
        t.split(/[。；;！!？?]/).forEach(function (p) {
          p = p.trim();
          if (p) segs.push(p);
        });
      });

      // ③ 这条消息里最适合当标题的那句（用于「时间为：…」这种纯时间句）
      var msgTitle = "";
      (function () {
        for (var k = 0; k < segs.length; k++) {
          var c = cleanTitle(segs[k]);
          if (c && c.replace(/[\d\s年月日号:：—\-（）()]/g, "").length >= 8) { msgTitle = c; return; }
        }
      })();

      // ④ 逐句判断，同时满足「说了时间」和「要求做事/在说截止」才收
      segs.forEach(function (p) {
        if (p.length < 5) return;
        var isBareDate = /^\D{0,6}\d{4}\s*年\s*\d{1,2}\s*月\s*\d{1,2}\s*日/.test(p) && p.length < 26;
        if (isBareDate) return;

        var when = parseWhen(p, base);
        var hasTime = !!(when.due || when.time || DATE_HINT_RE.test(p));
        if (!hasTime) return;
        if (!ACTION_RE.test(p) && !TIME_SAY_RE.test(p)) return;

        // 没有日期又极短（「大家尽快完成」），脱离上下文没有意义，丢掉
        if (!when.due && p.length < 10) return;

        var title = cleanTitle(p);
        if (!title) return;
        // 「活动时间为：…」这类纯时间句，换成消息开头那句
        if (/^(活动)?时间为/.test(title) && msgTitle) title = msgTitle;
        // 「详情见通知链接，有意参赛同学请于 11 月 7 日前…」也是补充说明，
        // 真正的主题在消息开头，换成 msgTitle
        if (msgTitle && /^(详情见|详见|有意|请于|请|如需|如有|想要|需要报名|本条|本通知|报名)/.test(title)) {
          title = msgTitle;
        }
        // 去掉标题开头的日期（下面已经单独显示了日期）
        var stripped = title
          .replace(/^\d{4}\s*年\s*\d{1,2}\s*月\s*\d{1,2}\s*[日号]?\s*(\d{1,2}\s*[:：]\s*\d{2})?\s*/, "")
          .replace(/^\d{1,2}\s*月\s*\d{1,2}\s*[日号]?\s*(\d{1,2}\s*[:：]\s*\d{2})?\s*/, "");
        if (stripped.length >= 3) title = stripped;
        title = title.replace(/[，,：:]?(事项如下|通知如下|如下)[：:]?$/, "");
        if (!title) return;
        items.push({
          title: title,
          due: when.due,
          time: when.time,
          materials: extractMaterials(p),
          source: p
        });
      });
    });

    // ④ 批内去重
    var seen = {}, out = [];
    items.forEach(function (x) {
      var key = x.title + "|" + x.due;
      if (seen[key]) return;
      seen[key] = 1;
      out.push(x);
    });
    return out;
  }

  /* ============ 存储：累积清单（PRD 5. 追加不覆盖） ============
     重要：内存里的 STATE 才是唯一数据源，localStorage 只负责「下次打开还在」。
     否则一旦浏览器禁用了存储（预览面板的沙箱 iframe、无痕模式、禁 Cookie），
     写不进去又每次重读 -> 页面永远空白且不报错。 */
  var STATE = null;
  var STORAGE_OK = true;

  function load() {
    try {
      var raw = localStorage.getItem(STORE_ITEMS);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) { STORAGE_OK = false; return []; }
  }
  function current() {
    if (STATE === null) STATE = load();
    return STATE;
  }
  function save(list) {
    STATE = list;
    try { localStorage.setItem(STORE_ITEMS, JSON.stringify(list)); }
    catch (e) { STORAGE_OK = false; }
  }
  function itemKey(x) { return x.title + "|" + (x.due || "") + "|" + (x.time || ""); }

  function mergeItems(fresh) {
    var all = current();
    var seen = {};
    all.forEach(function (x) { seen[itemKey(x)] = 1; });
    var added = 0;
    fresh.forEach(function (x) {
      var k = itemKey(x);
      if (seen[k]) return;
      seen[k] = 1;
      x.id = String(Date.now()) + "-" + Math.random().toString(36).slice(2, 7);
      x.done = false;
      all.push(x);
      added++;
    });
    save(all);
    return added;
  }

  /* 每次渲染重算天数与紧急程度（昨天存的 due 今天可能已经过期） */
  function refreshMeta(list) {
    var base = startOfDay(new Date());
    list.forEach(function (x) {
      if (x.due) {
        x.days = dayDiff(parseYmd(x.due), base);
        x.level = x.days < 0 ? "over" : (x.days <= 3 ? "urgent" : (x.days <= 7 ? "soon" : ""));
      } else {
        x.days = null;
        x.level = "nodate";
      }
    });
    return list;
  }

  /* ============ 渲染 ============ */
  function el(tag, cls, text) {
    var d = document.createElement(tag);
    if (cls) d.className = cls;
    if (text !== undefined) d.textContent = text;
    return d;
  }

  function dueText(x) {
    if (!x.due) return "未写日期";
    var d = parseYmd(x.due);
    var s = (d.getMonth() + 1) + "月" + d.getDate() + "日 周" + WD_CN[d.getDay()];
    if (x.time) s += " " + x.time;
    return s;
  }
  function relText(x) {
    if (x.days === null) return "";
    if (x.days < 0) return "已过 " + (-x.days) + " 天";
    if (x.days === 0) return "就是今天";
    return "还有 " + x.days + " 天";
  }

  var GROUPS = [
    { k: "over",   t: "已过期" },
    { k: "urgent", t: "3 天内" },
    { k: "soon",   t: "一周内" },
    { k: "far",    t: "更远" },
    { k: "nodate", t: "未注明日期" }
  ];
  function groupOf(x) {
    if (x.days === null) return "nodate";
    if (x.days < 0) return "over";
    if (x.days <= 3) return "urgent";
    if (x.days <= 7) return "soon";
    return "far";
  }

  function itemNode(x) {
    var g = groupOf(x);
    var node = el("div", "item g-" + g + (x.done ? " is-done" : ""));

    var chk = el("button", "chk", x.done ? "✓" : "");
    chk.setAttribute("data-act", "toggle");
    chk.setAttribute("data-id", x.id);
    chk.title = x.done ? "标记为未完成" : "标记为已完成";
    node.appendChild(chk);

    var body = el("div", "body");
    var tdiv = el("div", "t", x.title);
    if (x.src === "ai") tdiv.appendChild(el("span", "ai-badge", "AI"));
    body.appendChild(tdiv);

    var meta = el("div", "meta");
    meta.appendChild(document.createTextNode(dueText(x)));
    var rel = relText(x);
    if (rel) {
      meta.appendChild(document.createTextNode(" · "));
      var span = el("span", (x.days !== null && x.days <= 3) ? "red" : "", rel);
      meta.appendChild(span);
    }
    body.appendChild(meta);

    if (x.materials && x.materials.length) {
      var tags = el("div", "tags");
      x.materials.forEach(function (m) { tags.appendChild(el("span", "tag", "交 " + m)); });
      body.appendChild(tags);
    }

    if (x.source) {
      var det = el("details", "src");
      det.appendChild(el("summary", "", "看原句"));
      det.appendChild(el("p", "", x.source));
      body.appendChild(det);
    }

    node.appendChild(body);

    var del = el("button", "del", "×");
    del.setAttribute("data-act", "del");
    del.setAttribute("data-id", x.id);
    del.title = "删除这条";
    node.appendChild(del);

    return node;
  }

  function render() {
    var all = refreshMeta(current());
    var todo = all.filter(function (x) { return !x.done; });
    var done = all.filter(function (x) { return x.done; });

    /* 顶部统计 */
    if (!all.length) {
      $stats.textContent = "清单还是空的。先粘几条群通知试试。";
    } else {
      var urgent = todo.filter(function (x) { return x.days !== null && x.days >= 0 && x.days <= 3; }).length;
      var over = todo.filter(function (x) { return x.days !== null && x.days < 0; }).length;
      $stats.innerHTML = "";
      $stats.appendChild(document.createTextNode("清单共 " + all.length + " 条 · "));
      $stats.appendChild(el("b", "", "待办 " + todo.length));
      $stats.appendChild(document.createTextNode(" · 3 天内 " + urgent + (over ? " · 已过期 " + over : "") + " · 已完成 " + done.length));
    }

    /* 存储不可用时如实提示，而不是假装正常、刷新后悄悄丢数据 */
    if (!STORAGE_OK) {
      $stats.textContent += " ｜ 浏览器不允许本地保存，关掉页面后清单会丢";
    }

    /* tab 计数 */
    var counts = { todo: todo.length, done: done.length, all: all.length };
    Array.prototype.forEach.call($tabs.children, function (b) {
      var k = b.getAttribute("data-tab");
      var base = k === "todo" ? "待办" : (k === "done" ? "已完成" : "全部");
      b.textContent = base + " " + counts[k];
      b.className = (k === tab ? "on" : "");
    });

    /* 主体 */
    $result.innerHTML = "";
    var list = tab === "todo" ? todo : (tab === "done" ? done : all);

    if (!list.length) {
      var msg = tab === "todo"
        ? (all.length ? "待办都清空了。粘一条新通知继续加。" : "还没有条目。把群里的通知粘进来，或者直接截个图丢进来。")
        : (tab === "done" ? "还没有完成的事项。做完一条就勾掉它。" : "清单是空的。");
      var box = el("div", "empty");
      /* 插图克制：只在整份清单为空时出现一次，其余空状态只留文字 */
      if (tab === "todo" && !all.length) {
        var pic = document.createElement("img");
        pic.className = "mascot";
        pic.src = MASCOT;
        pic.alt = "一只托腮等通知的小黄龙";
        box.appendChild(pic);
      }
      box.appendChild(el("div", "empty-msg", msg));
      $result.appendChild(box);
    } else if (tab === "done") {
      list.slice().reverse().forEach(function (x) { $result.appendChild(itemNode(x)); });
    } else {
      GROUPS.forEach(function (g) {
        var bucket = list.filter(function (x) { return groupOf(x) === g.k; });
        if (!bucket.length) return;
        $result.appendChild(el("div", "group-title", g.t + "（" + bucket.length + "）"));
        bucket.forEach(function (x) { $result.appendChild(itemNode(x)); });
      });
    }

    $ops.style.display = all.length ? "flex" : "none";
  }

  /* ============ 提示与确认 ============
     不用 alert()/confirm()：原生弹窗在手机上常是系统深色框，跟页面两张皮，
     而且会冻结整个页面。改成页面内的轻提示 + 自定义确认框，样式跟着主题变量走。
     toast(msg, ms)      —— 底部浮出，自动消失，不打断操作
     ask(msg, onYes)     —— 需要用户点头的破坏性操作（目前只有「清空全部清单」） */
  function toast(msg, ms) {
    var el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    $toastW.appendChild(el);
    while ($toastW.children.length > 3) $toastW.removeChild($toastW.firstChild);
    setTimeout(function () {
      el.classList.add("out");
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 220);
    }, ms || 2800);
  }

  var askYes = null;
  function ask(msg, onYes) {
    $dlgTxt.textContent = msg;
    askYes = onYes;
    $mask.hidden = false;
    $dlgNo.focus();                       // 焦点默认落在「取消」，防误触
  }
  function closeAsk() { $mask.hidden = true; askYes = null; }
  $dlgYes.addEventListener("click", function () {
    var fn = askYes;
    closeAsk();
    if (fn) fn();
  });
  $dlgNo.addEventListener("click", closeAsk);
  $mask.addEventListener("click", function (e) { if (e.target === $mask) closeAsk(); });
  document.addEventListener("keydown", function (e) {
    if (!$mask.hidden && e.key === "Escape") closeAsk();
  });

  /* ============ 截图输入 ============
     微信截图 → Ctrl+V / 拖进来 / 手机上选相册。
     压缩只为省上传时间：模型那边每张图最多算 1024 token（约 1300×1300），
     所以缩到长边 1800、JPEG 0.9 既看得清字，又不会白花 token。 */
  var IMGS = [];
  var MAX_IMG = 6;
  var imgSeq = 0;

  function compressImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        try {
          var max = 1800;
          var w = img.naturalWidth || 1, h = img.naturalHeight || 1;
          var s = Math.min(1, max / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * s)), ch = Math.max(1, Math.round(h * s));
          var cv = document.createElement("canvas");
          cv.width = cw; cv.height = ch;
          var ctx = cv.getContext("2d");
          ctx.fillStyle = "#fff";           // 透明底直接转 JPEG 会变黑，先铺白
          ctx.fillRect(0, 0, cw, ch);
          ctx.drawImage(img, 0, 0, cw, ch);
          URL.revokeObjectURL(url);
          resolve(cv.toDataURL("image/jpeg", 0.9));
        } catch (e) { reject(new Error("浏览器处理不了这张图")); }
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("这张图打不开")); };
      img.src = url;
    });
  }

  function renderThumbs() {
    $thumbs.innerHTML = "";
    $thumbs.hidden = !IMGS.length;
    IMGS.forEach(function (im) {
      var box = document.createElement("div");
      box.className = "thumb";
      var pic = document.createElement("img");
      pic.src = im.dataUrl;
      pic.alt = "聊天截图";
      var del = document.createElement("button");
      del.type = "button";
      del.textContent = "×";
      del.setAttribute("aria-label", "删掉这张图");
      del.addEventListener("click", function () {
        IMGS = IMGS.filter(function (x) { return x.id !== im.id; });
        renderThumbs();
      });
      box.appendChild(pic);
      box.appendChild(del);
      $thumbs.appendChild(box);
    });
  }

  function addImages(files) {
    var list = Array.prototype.slice.call(files || []).filter(function (f) {
      return f && /^image\//.test(f.type || "");
    });
    if (!list.length) { toast("只认图片文件（截图、照片都行）。"); return; }
    var room = MAX_IMG - IMGS.length;
    if (room <= 0) { toast("一次最多 " + MAX_IMG + " 张，先删掉几张再加。"); return; }
    if (list.length > room) {
      var skipped = list.length - room;
      list = list.slice(0, room);
      toast("一次最多 " + MAX_IMG + " 张，多出来的 " + skipped + " 张先跳过了，可以分两批加。", 4500);
    }
    if (list.some(function (f) { return f.size > 12 * 1024 * 1024; })) {
      toast("有图片超过 12MB，先裁掉一部分再试。");
      return;
    }
    Promise.all(list.map(compressImage)).then(function (urls) {
      urls.forEach(function (u) { IMGS.push({ id: "img" + (++imgSeq), dataUrl: u }); });
      renderThumbs();
    }).catch(function (e) { toast("图片处理失败：" + e.message); });
  }

  /* ============ AI 增强层（DeepSeek） ============
     原则：AI 是增强，不是命脉。
     - 没填 Key：纯规则，断网可用
     - 填了 Key 但超时/失败/被跨域拦：自动回退规则，界面不报红，只在状态栏说明
     模型说明（2026-11 核对官方文档）：
     - 模型名用 deepseek-flash。旧的 deepseek-chat 已于 2026/07/24 弃用。
     - deepseek-flash 默认开启思考模式，会让抽取变慢变贵，这里显式关闭。 */
  var AI = {
    name: "DeepSeek",
    url: "https://api.deepseek.com/chat/completions",
    model: "deepseek-flash"
  };
  var AI_STORE = "deadline-radar:ai";

  function setAiStatus(msg, cls) {
    $aiStat.textContent = msg;
    $aiStat.className = "ai-state" + (cls ? " " + cls : "");
  }
  /* 折叠状态下一眼看出 AI 通没通，答辩前不用点开面板检查 */
  function syncAiSum() {
    var ok = !!($aiKey.value || "").trim();
    $aiSum.textContent = ok ? "· 已就绪" : "· 未接入，纯本地规则";
    $aiSum.className = "ai-sum" + (ok ? " on" : "");
  }
  function ymdCN(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }

  /* 把 HTTP 状态码翻译成用户能看懂、能自己动手解决的话 */
  function friendlyErr(status, body) {
    var b = String(body || "");
    if (status === 401 || status === 403) return "Key 不对或已失效，去 platform.deepseek.com 重新创建一个";
    if (status === 402) return "DeepSeek 账户余额不足，去 platform.deepseek.com 充值后再试";
    if (status === 429) return "请求太频繁或额度用尽，等几十秒再试";
    if (status === 400 || status === 404) return "请求被拒（HTTP " + status + "）：" + b.replace(/\s+/g, " ").slice(0, 60);
    if (status >= 500) return "DeepSeek 服务端出错（HTTP " + status + "），稍后再试";
    return "HTTP " + status + " " + b.replace(/\s+/g, " ").slice(0, 60);
  }

  function aiPrompt(text, nImg) {
    var head = "今天是 " + ymdCN(new Date()) + "。\n";
    if (nImg) {
      head += "下面是微信群聊的截图，共 " + nImg + " 张。读图时守这几条：\n" +
        "· 每条消息旁的昵称和发送时间是「相对时间」的换算基准，不要拿今天去算。\n" +
        "· 多张图可能拍到同一段消息，重复的只留一条。\n" +
        "· 表情、红包、文件大小、「以下是新消息」这类系统提示都不是待办。\n" +
        "· 图里的日期分隔线（昨天 / 星期三）可以拿来推算，但结论要落到具体日期。\n";
    } else {
      head += "下面是一段真实的微信群聊天记录，可能包含「昵称 + 发送时间」的消息头、表情、链接、附件和闲聊。\n";
    }
    return head +
      "请从中找出所有「要在某个时间点之前完成的事」，整理成待办。\n" +
      "要求：\n" +
      "1. title：一句话说清要做什么，20 字以内，用动词开头，要概括不要照抄原句，不要带昵称、@、表情。\n" +
      "2. due：截止日期 YYYY-MM-DD。相对时间（今天/明天/下周三/月底）必须按该条消息的发送时间换算，不要按今天算。\n" +
      "3. time：截止时刻 HH:MM，没写就 null；区间日期（如 11月2日8:00—11月7日24:00）取结束时间。\n" +
      "4. materials：真正要提交或携带的东西，字符串数组，没有就 []。不要写「链接」「通知」「材料」。\n" +
      "5. source：最能支撑这条待办的那句原文，原样截取，不要改写。\n" +
      "6. 一句话里有多件事就拆成多条；纯闲聊、通知转发、单纯让人进群、已经明显过期的，不要收录。\n" +
      "只输出一个 json 对象，不要解释，不要代码块：\n" +
      '{"items":[{"title":"","due":"YYYY-MM-DD","time":"HH:MM","materials":[],"source":""}]}\n\n' +
      (String(text || "").trim() ? "聊天记录（文字）：\n" + text : "（这次没有文字，只按上面的截图处理）");
  }

  function callAI(text, key, images) {
    var imgs = images || [];
    var wait = imgs.length ? 60000 : 30000;   // 图片要多给时间：上传 + 读图
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, wait);

    /* 图片必须以「内容块数组」形式放进 user 消息；放 system 里会 400 */
    var content;
    if (imgs.length) {
      content = [{ type: "text", text: aiPrompt(text, imgs.length) }];
      imgs.forEach(function (im) {
        content.push({ type: "image_url", image_url: { url: im.dataUrl, detail: "original" } });
      });
    } else {
      content = aiPrompt(text, 0);
    }

    return fetch(AI.url, {
      method: "POST",
      signal: ctrl.signal,
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
      body: JSON.stringify({
        model: AI.model,
        temperature: 0,
        max_tokens: 4096,
        response_format: { type: "json_object" },
        thinking: { type: "disabled" },
        messages: [
          { role: "system", content: "你是中文信息抽取器，只输出 json，不输出任何解释。" },
          { role: "user", content: content }
        ]
      })
    }).then(function (res) {
      clearTimeout(timer);
      if (!res.ok) {
        return res.text().then(function (t) {
          throw new Error(friendlyErr(res.status, t));
        });
      }
      return res.json();
    }).then(function (data) {
      var s = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      // JSON 模式下模型偶尔会把无法识别的内容替换成空格，content 可能看起来是空的
      if (!s || !String(s).trim()) throw new Error("模型这次没返回内容，再点一次就好");
      s = String(s).replace(/```json|```/g, "").trim();
      var i = s.indexOf("{"), j = s.lastIndexOf("}");
      if (i >= 0 && j > i) s = s.slice(i, j + 1);
      var obj;
      try { obj = JSON.parse(s); } catch (e) { throw new Error("模型返回的不是合法 JSON，再点一次就好"); }
      var arr = Array.isArray(obj) ? obj : (obj.items || []);
      return arr.map(function (x) {
        var t = String(x.time || "");
        return {
          title: String(x.title || "").trim(),
          due: /^\d{4}-\d{2}-\d{2}$/.test(x.due) ? x.due : null,
          time: /^\d{1,2}:\d{2}$/.test(t) ? pad(+t.split(":")[0]) + ":" + t.split(":")[1] : null,
          materials: Array.isArray(x.materials) ? x.materials.filter(Boolean).map(String) : [],
          source: String(x.source || "").trim(),
          src: "ai"
        };
      }).filter(function (x) { return x.title; });
    }).catch(function (e) {
      clearTimeout(timer);
      if (e && e.name === "AbortError") throw new Error("超时 " + (wait / 1000) + " 秒");
      if (e instanceof TypeError) throw new Error("网络不通或被跨域拦截");
      throw e;
    });
  }

  /* AI 条目优先，规则条目补漏：同一条只留一个，AI 缺日期就用规则算出的补上 */
  function normKey(t) { return String(t || "").replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, "").slice(0, 12); }
  function mergeFresh(aiItems, ruleItems) {
    var out = aiItems.slice();
    ruleItems.forEach(function (r) {
      var rk = normKey(r.title), hit = null, i, ok;
      for (i = 0; i < out.length; i++) {
        ok = normKey(out[i].title);
        if (!ok || !rk) continue;
        if (ok.indexOf(rk) >= 0 || rk.indexOf(ok) >= 0) { hit = out[i]; break; }
      }
      if (hit) {
        if (!hit.due && r.due) { hit.due = r.due; hit.time = hit.time || r.time; }
        if (!hit.source) hit.source = r.source;
        if ((!hit.materials || !hit.materials.length) && r.materials.length) hit.materials = r.materials;
        return;
      }
      out.push(r);
    });
    return out;
  }

  function loadAiCfg() {
    try {
      var c = JSON.parse(localStorage.getItem(AI_STORE) || "null");
      if (c && c.key) {
        $aiKey.value = c.key;
        $aiRem.checked = true;
        setAiStatus("已记住 Key，当前：AI 概括 + 规则兜底（" + AI.model + "）。", "on");
      }
    } catch (e) {}
    syncAiSum();
  }
  function saveAiCfg() {
    try {
      if ($aiRem.checked && $aiKey.value.trim()) {
        localStorage.setItem(AI_STORE, JSON.stringify({ key: $aiKey.value.trim() }));
      } else {
        localStorage.removeItem(AI_STORE);
      }
    } catch (e) {}
    syncAiSum();
  }

  /* ============ 交互 ============ */
  $result.addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!btn) return;
    var id = btn.getAttribute("data-id");
    var act = btn.getAttribute("data-act");
    var all = current();
    var i;
    for (i = 0; i < all.length; i++) if (all[i].id === id) break;
    if (i >= all.length) return;

    if (act === "toggle") {
      all[i].done = !all[i].done;
      save(all);
      render();
    } else if (act === "del") {
      all.splice(i, 1);
      save(all);
      render();
    }
  });

  $tabs.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("[data-tab]") : null;
    if (!b) return;
    tab = b.getAttribute("data-tab");
    render();
  });

  function finish(fresh, note, isErr) {
    busy = false;
    $run.disabled = false;
    $run.textContent = "分析并加入清单";
    if (note) setAiStatus(note, isErr ? "err" : "on");
    if (!fresh.length) {
      if (IMGS.length) {
        toast("这次没抽出条目。可以试试：\n① 截图只留通知那几条，把闲聊裁掉\n② 顺便把关键文字也粘一点进来\n③ 再点一次（模型偶尔会空手而归）", 6000);
      } else {
        toast("没找到「什么时候要做什么」的句子。\n\n两个办法：\n① 原文里带上时间词（本周五 18:00 前、11 月 13 日前）\n② 在上面「AI 概括」里填一个 DeepSeek Key，让模型帮你概括", 6000);
      }
      return;
    }
    var added = mergeItems(fresh);
    var dup = fresh.length - added;
    $input.value = "";
    IMGS = [];
    renderThumbs();
    try { localStorage.removeItem(STORE_INPUT); } catch (e) {}
    tab = "todo";
    render();
    if (!added) toast("这批 " + fresh.length + " 条都已经在清单里了，没有重复添加。");
    else if (dup) toast("加入 " + added + " 条，" + dup + " 条已存在被跳过。");
  }

  function run() {
    if (busy) return;
    var text = $input.value;
    var hasImg = IMGS.length > 0;

    if (!text.trim() && !hasImg) {
      toast("先粘几条群通知，或者直接 Ctrl + V 粘一张聊天截图。也可以点「填入示例」看效果。");
      $input.focus();
      return;
    }

    // 规则只认得文字；纯截图时它没有输入，只能等 AI
    var ruleItems = [];
    try { if (text.trim()) ruleItems = extract(text); } catch (e) {}

    var key = ($aiKey.value || "").trim();

    // 截图必须走 AI。本地规则读不了图，必须明说，不能默默失败
    if (hasImg && !key) {
      $aiBox.open = true;
      setAiStatus("截图要靠 AI 读，先在下面填一个 DeepSeek Key。", "err");
      $aiKey.focus();
      return;
    }

    if (!key) { finish(ruleItems, "本地规则模式：只摘句、不概括。填入 Key 可让 AI 概括成一句话待办。", false); return; }

    busy = true;
    $run.disabled = true;
    $run.textContent = hasImg ? "AI 读图中…" : "AI 分析中…";
    callAI(text, key, IMGS).then(function (items) {
      saveAiCfg();
      finish(mergeFresh(items, ruleItems),
        "AI 概括完成：" + items.length + " 条（" + AI.name + " · " + AI.model +
        (hasImg ? "，含 " + IMGS.length + " 张截图" : "") + "）", false);
    }).catch(function (err) {
      finish(ruleItems, "AI 没调通（" + err.message + "）" +
        (hasImg ? "，截图没读成。" : "，已自动改用本地规则，结果仍然可用。"), true);
    });
  }

  $run.addEventListener("click", run);

  /* ---- 一键读取剪贴板：手机上少一次「长按选中 → 复制 → 切窗口 → 粘贴」 ----
     浏览器要求必须由用户点击触发，且 https / localhost 下才给权限；
     本地 file:// 或手机浏览器不给权限时，如实提示改用 Ctrl + V，不装作成功。 */
  $clip.addEventListener("click", function () {
    if (!navigator.clipboard || !navigator.clipboard.readText) {
      toast("这个浏览器不支持一键读取。直接 Ctrl + V 把通知粘进上面的框，效果一样。", 5000);
      $input.focus();
      return;
    }
    navigator.clipboard.readText().then(function (txt) {
      txt = String(txt || "").trim();
      if (!txt) { toast("剪贴板是空的，先复制一段群通知。", 4000); return; }
      $input.value = $input.value.trim() ? ($input.value.replace(/\s+$/, "") + "\n" + txt) : txt;
      try { localStorage.setItem(STORE_INPUT, $input.value); } catch (e) {}
      toast("读到 " + txt.length + " 个字，已经放进输入框。点「分析并加入清单」就行。");
      $input.focus();
    }).catch(function (e) {
      toast("没读到剪贴板（" + (e && e.name ? e.name : "权限被拒") +
        "）。本地打开或手机浏览器常会拦，直接 Ctrl + V 粘贴就行。", 6000);
      $input.focus();
    });
  });

  /* ---- 截图入口：按钮 / 文件选择 / 粘贴 / 拖拽，四条路都通 ---- */
  $pick.addEventListener("click", function () { $file.click(); });

  $file.addEventListener("change", function () {
    addImages($file.files);
    $file.value = "";               // 允许连续选同一张
  });

  document.addEventListener("paste", function (e) {
    var cd = e.clipboardData;
    if (!cd) return;
    var items = cd.items || [];
    var files = [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === "file" && /^image\//.test(items[i].type || "")) {
        var f = items[i].getAsFile();
        if (f) files.push(f);
      }
    }
    if (!files.length) return;       // 粘的是文字，交给输入框自己处理
    e.preventDefault();
    addImages(files);
  });

  ["dragenter", "dragover"].forEach(function (ev) {
    document.addEventListener(ev, function (e) {
      if (!e.dataTransfer) return;
      e.preventDefault();
      $inCard.classList.add("dragging");
    });
  });
  ["dragleave", "dragend"].forEach(function (ev) {
    document.addEventListener(ev, function () { $inCard.classList.remove("dragging"); });
  });
  document.addEventListener("drop", function (e) {
    if (!e.dataTransfer) return;
    var files = e.dataTransfer.files;
    $inCard.classList.remove("dragging");
    if (!files || !files.length) return;
    var anyImg = false;
    for (var i = 0; i < files.length; i++) if (/^image\//.test(files[i].type || "")) anyImg = true;
    if (!anyImg) return;
    e.preventDefault();
    addImages(files);
  });

  /* 输入 Key 时标题立刻变「已就绪」，不必等测试 */
  $aiKey.addEventListener("input", syncAiSum);

  $clear.addEventListener("click", function () {
    $input.value = "";
    IMGS = [];
    renderThumbs();
    try { localStorage.removeItem(STORE_INPUT); } catch (e) {}
    $input.focus();
  });

  $sample.addEventListener("click", function () {
    $input.value = [
      "【学工办】请各班班长于下周五 18:00 前将《创新学分汇总表》电子版发送至学工办邮箱，逾期不予受理。",
      "【教务】请于 2026 年 11 月 13 日前完成本学期评教，未完成的同学将影响成绩查询。",
      "各位同学注意：下周三上午 9 点在三号楼 302 开会，记得带上学生证和一份个人简历。",
      "关于奖学金申请的通知：符合条件的同学请在 11 月 20 日之前提交申请表和成绩单扫描件到辅导员处。",
      "明天中午 12 点前把宿舍卫生检查表交到生活委员那里。",
      "本学期读书笔记请于月底前提交至学习通。"
    ].join("\n");
    $input.focus();
  });

  document.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") run();
  });

  $input.addEventListener("input", function () {
    try { localStorage.setItem(STORE_INPUT, $input.value); } catch (e) {}
  });

  /* ============ 导出：只导未完成且有日期的 ============ */
  function icsEscape(s) {
    return String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
  }
  function fold(line) {
    if (line.length <= 72) return line;
    var out = line.slice(0, 72), rest = line.slice(72);
    while (rest.length) { out += "\r\n " + rest.slice(0, 71); rest = rest.slice(71); }
    return out;
  }

  $ics.addEventListener("click", function () {
    var list = refreshMeta(current()).filter(function (x) { return !x.done && x.due; });
    if (!list.length) {
      toast("没有「未完成且写了日期」的条目。先勾掉做完的，或者确认通知里写了截止时间。");
      return;
    }

    var now = new Date();
    var stamp = now.getUTCFullYear() + pad(now.getUTCMonth() + 1) + pad(now.getUTCDate()) + "T" +
                pad(now.getUTCHours()) + pad(now.getUTCMinutes()) + pad(now.getUTCSeconds()) + "Z";

    var L = [
      "BEGIN:VCALENDAR", "VERSION:2.0",
      "PRODID:-//Deadline Radar//HENU HACK 2026//CN",
      "CALSCALE:GREGORIAN", "METHOD:PUBLISH"
    ];

    list.forEach(function (x, idx) {
      var d0 = parseYmd(x.due), d1 = addDays(d0, 1);
      L.push("BEGIN:VEVENT");
      L.push("UID:" + stamp + "-" + idx + "@deadline-radar");
      L.push("DTSTAMP:" + stamp);
      L.push("DTSTART;VALUE=DATE:" + ymdCompact(d0));
      L.push("DTEND;VALUE=DATE:" + ymdCompact(d1));
      L.push(fold("SUMMARY:" + icsEscape("截止 · " + x.title + (x.time ? " " + x.time : ""))));
      L.push(fold("DESCRIPTION:" + icsEscape(
        (x.materials && x.materials.length ? "要交：" + x.materials.join("、") + "\n" : "") + "原句：" + x.source
      )));
      L.push("BEGIN:VALARM");
      L.push("TRIGGER:-PT12H");
      L.push("ACTION:DISPLAY");
      L.push(fold("DESCRIPTION:" + icsEscape("明天截止：" + x.title)));
      L.push("END:VALARM");
      L.push("END:VEVENT");
    });
    L.push("END:VCALENDAR");

    var blob = new Blob([L.join("\r\n")], { type: "text/calendar;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "截止日雷达.ics";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  });

  /* ============ 导出：复制成文本（只复制待办） ============ */
  $copy.addEventListener("click", function () {
    var list = refreshMeta(current()).filter(function (x) { return !x.done; });
    if (!list.length) { toast("待办是空的，没有可复制的内容。"); return; }

    var btn = $copy;
    var text = "【截止日清单】\n" + list.map(function (x) {
      return "· " + (x.due ? x.due + (x.time ? " " + x.time : "") : "未注明") + "  " + x.title +
        (x.materials && x.materials.length ? "（交：" + x.materials.join("、") + "）" : "");
    }).join("\n");

    function ok() {
      var t = btn.textContent;
      btn.textContent = "已复制 ✓";
      setTimeout(function () { btn.textContent = t; }, 1500);
    }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); ok(); } catch (e) { toast("复制失败，请手动选中文字"); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, fallback);
    } else { fallback(); }
  });

  /* ============ 清空全部 ============ */
  $wipe.addEventListener("click", function () {
    var n = current().length;
    if (!n) return;
    ask("确定清空全部 " + n + " 条清单？\n这个操作不能撤销。", function () {
      save([]);
      render();
      toast("已清空 " + n + " 条清单。");
    });
  });

  /* ============ 测试 AI 连接 ============ */
  $aiTest.addEventListener("click", function () {
    var key = ($aiKey.value || "").trim();
    if (!key) { setAiStatus("先填 Key 再测试。", "err"); $aiKey.focus(); return; }
    $aiTest.disabled = true;
    setAiStatus("测试中…（最多 30 秒）", "");
    callAI("【测试】请于明天下午 3 点前交一份活动总结。", key).then(function (items) {
      $aiTest.disabled = false;
      saveAiCfg();
      if (!items.length) { setAiStatus("通了，但模型没抽出条目。再点一次试试。", "err"); return; }
      setAiStatus("连接成功：" + AI.name + " · " + AI.model + "，识别到「" + items[0].title + "」。", "on");
    }).catch(function (err) {
      $aiTest.disabled = false;
      setAiStatus("失败：" + err.message, "err");
    });
  });

  /* ============ 启动 ============ */
  try {
    var saved = localStorage.getItem(STORE_INPUT);
    if (saved) $input.value = saved;
  } catch (e) {}

  loadAiCfg();
  render();
})();
</script>
</body>
</html>
